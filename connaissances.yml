prophetes:
- date:
    ar: نحو ١٣٠٠ ق.م
    en: ~1300 BC
    fr: ~1300 av. J.-C.
  epoque: exode
  id: moise
  nom:
    ar: موسى
    en: Moses
    fr: Moïse
  pos: 12.9
  vers:
    ar: 'في التجلّي، يعيد الصوتُ هذه الكلماتِ عينَها: «له اسمعوا».'
    en: 'At the Transfiguration, the voice repeats these exact words: “listen to him”.'
    fr: 'À la Transfiguration, la voix reprend ces mots exacts : « écoutez-le ».'
- date:
    ar: نحو ١٠٠٠ ق.م
    en: ~1000 BC
    fr: ~1000 av. J.-C.
  epoque: royaume
  id: nathan
  nom:
    ar: ناثان / داود
    en: Nathan / David
    fr: Nathan / David
  pos: 32.26
  vers:
    ar: 'الملاكُ لمريم: «يعطيه الربُّ كرسيَّ داود… ولا يكون لملكه نهاية» (لوقا ١: ٣٢-٣٣).'
    en: 'The angel to Mary: “the Lord will give him the throne of David… his reign will have no end” (Luke
      1:32-33).'
    fr: 'L''ange à Marie : « le Seigneur lui donnera le trône de David… son règne n''aura point de fin
      » (Luc 1:32-33).'
- date:
    ar: نحو ٨٣٠ ق.م (مختلَف فيه)
    en: ~830 BC (debated)
    fr: ~830 av. J.-C. (débattu)
  epoque: division
  id: joel
  nom:
    ar: يوئيل
    en: Joel
    fr: Joël
  pos: 43.23
  vers:
    ar: 'بطرس صباح الخمسين: «هذا ما قيل بالنبي يوئيل» (أعمال ٢: ١٦-١٧).'
    en: 'Peter, on the morning of Pentecost: “this is what was spoken through the prophet Joel” (Acts
      2:16-17).'
    fr: 'Pierre, au matin de la Pentecôte : « c''est ici ce qui a été dit par le prophète Joël » (Actes
      2:16-17).'
- date:
    ar: نحو ٧٦٠ ق.م
    en: ~760 BC
    fr: ~760 av. J.-C.
  epoque: division
  id: amos
  nom:
    ar: عاموس
    en: Amos
    fr: Amos
  pos: 47.74
  vers:
    ar: 'يُقتبَس في مجمع أورشليم ليقول إن الأمم مشمولةٌ في المملكة المُقامة (أعمال ١٥: ١٦).'
    en: Cited at the Council of Jerusalem to show the nations are included in the raised kingdom (Acts
      15:16).
    fr: Cité au concile de Jérusalem pour dire que les nations sont incluses dans le royaume relevé (Actes
      15:16).
- date:
    ar: نحو ٧٥٠ ق.م
    en: ~750 BC
    fr: ~750 av. J.-C.
  epoque: division
  id: osee
  nom:
    ar: هوشع
    en: Hosea
    fr: Osée
  pos: 48.39
  vers:
    ar: 'يقرأ فيه متى عودةَ الطفل يسوع من مصر (متى ٢: ١٥).'
    en: Matthew reads in it the return of the child Jesus from Egypt (Matthew 2:15).
    fr: Matthieu y lit le retour d'Égypte de l'enfant Jésus (Matthieu 2:15).
- date:
    ar: نحو ٧٠٠ ق.م
    en: ~700 BC
    fr: ~700 av. J.-C.
  epoque: division
  id: esaie
  nom:
    ar: إشعياء
    en: Isaiah
    fr: Ésaïe
  pos: 51.61
  vers:
    ar: الأصحاحُ الأكثرُ اقتباسًا في العهد الجديد؛ نسخةٌ كاملة وُجدت في قمران، قبل الميلاد.
    en: The chapter most quoted by the New Testament; a complete copy found at Qumran, before Christ.
    fr: Le chapitre le plus cité par le Nouveau Testament ; copie complète retrouvée à Qumrân, avant J.-C.
- date:
    ar: نحو ٧٠٠ ق.م
    en: ~700 BC
    fr: ~700 av. J.-C.
  epoque: division
  id: michee
  nom:
    ar: ميخا
    en: Micah
    fr: Michée
  pos: 51.55
  vers:
    ar: 'يقتبس الكتبةُ هذه الآيةَ لهيرودس ليدلّوا على مكان ميلاد المسيّا (متى ٢: ٦).'
    en: The scribes quote this verse to Herod to point out the Messiah's birthplace (Matthew 2:6).
    fr: Les scribes citent ce verset à Hérode pour indiquer le lieu de naissance du Messie (Matthieu 2:6).
- date:
    ar: نحو ٦٠٠ ق.م
    en: ~600 BC
    fr: ~600 av. J.-C.
  epoque: exil
  id: jeremie
  nom:
    ar: إرميا
    en: Jeremiah
    fr: Jérémie
  pos: 58.06
  vers:
    ar: 'يسوع والكأسُ في يده: «هذه الكأسُ هي العهدُ الجديد بدمي» (لوقا ٢٢: ٢٠).'
    en: 'Jesus, cup in hand: “this cup is the new covenant in my blood” (Luke 22:20).'
    fr: 'Jésus, la coupe en main : « cette coupe est la nouvelle alliance en mon sang » (Luc 22:20).'
- date:
    ar: نحو ٥٩٠ ق.م
    en: ~590 BC
    fr: ~590 av. J.-C.
  epoque: exil
  id: ezechiel
  nom:
    ar: حزقيال
    en: Ezekiel
    fr: Ézéchiel
  pos: 58.71
  vers:
    ar: '«أنا هو الراعي الصالح؛ الراعي الصالح يبذل نفسه عن الخراف» (يوحنا ١٠: ١١).'
    en: “I am the good shepherd; the good shepherd lays down his life for the sheep” (John 10:11).
    fr: « Je suis le bon berger ; le bon berger donne sa vie pour ses brebis » (Jean 10:11).
- date:
    ar: نحو ٥٥٠ ق.م
    en: ~550 BC
    fr: ~550 av. J.-C.
  epoque: exil
  id: daniel
  nom:
    ar: دانيال
    en: Daniel
    fr: Daniel
  pos: 61.29
  vers:
    ar: 'أمام رئيس الكهنة، ينسب يسوع هذه الرؤيا إلى نفسه — وهي التي تحسم إدانته (متى ٢٦: ٦٤).'
    en: Before the high priest, Jesus claims this vision — and it decides his condemnation (Matthew 26:64).
    fr: Devant le grand prêtre, Jésus s'attribue cette vision — et c'est elle qui décide de sa condamnation
      (Matthieu 26:64).
- date:
    ar: نحو ٥٢٠ ق.م
    en: ~520 BC
    fr: ~520 av. J.-C.
  epoque: retour
  id: aggee
  nom:
    ar: حجي
    en: Haggai
    fr: Aggée
  pos: 63.23
  vers:
    ar: 'الهيكلُ الثاني لم يكن فيه التابوت — لكن الطفل يسوع قُدِّم فيه (لوقا ٢: ٢٧-٣٢).'
    en: The second Temple had no ark — but the child Jesus was presented there (Luke 2:27-32).
    fr: Le second Temple n'eut pas l'arche — mais l'enfant Jésus y fut présenté (Luc 2:27-32).
- date:
    ar: نحو ٥٢٠ ق.م
    en: ~520 BC
    fr: ~520 av. J.-C.
  epoque: retour
  id: zacharie
  nom:
    ar: زكريا
    en: Zechariah
    fr: Zacharie
  pos: 63.29
  vers:
    ar: 'الدخولُ إلى أورشليم، أحدُ الشعانين (متى ٢١: ٥)؛ والجنبُ المطعون (يوحنا ١٩: ٣٧).'
    en: The entry into Jerusalem, Palm Sunday (Matthew 21:5); the pierced side (John 19:37).
    fr: L'entrée à Jérusalem, les Rameaux (Matthieu 21:5) ; le côté transpercé (Jean 19:37).
- date:
    ar: نحو ٤٣٠ ق.م
    en: ~430 BC
    fr: ~430 av. J.-C.
  epoque: retour
  id: malachie
  nom:
    ar: ملاخي
    en: Malachi
    fr: Malachie
  pos: 69.03
  vers:
    ar: 'يوحنا المعمدان هو هذا الرسول (متى ١١: ١٠) و«إيليا المزمع أن يأتي» (متى ١١: ١٤).'
    en: John the Baptist is this messenger (Matthew 11:10) and “the Elijah who was to come” (Matthew 11:14).
    fr: Jean-Baptiste est ce messager (Matthieu 11:10) et « l'Élie qui devait venir » (Matthieu 11:14).
- date:
    ar: نحو ٢٨ م
    en: ~AD 28
    fr: ~28 apr. J.-C.
  epoque: christ
  id: jean
  nom:
    ar: يوحنا المعمدان
    en: John the Baptist
    fr: Jean-Baptiste
  pos: 98.58
  vers:
    ar: 'خيطُ الحرّاس ينتهي هنا: يصير الإعلانُ حضورًا. وهنا يبدأ مسارُ الحمل.'
    en: 'The thread of the watchmen ends here: announcement becomes presence. This is where the journey
      of the Lamb begins.'
    fr: 'Le fil des veilleurs s''achève ici : l''annonce devient présence. C''est le début du parcours
      de l''Agneau.'
