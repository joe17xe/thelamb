<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La carte du ciel — L'Agneau de Dieu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0e18;--bg2:#11141f;--ink:#e9e3d3;--muted:#9a94a8;--gold:#d3a94f;--line:#23273a;--crimson:#a33;
        --fil:#b98b2a;--salle:#4f93dc;--pilier:#d15050}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;-webkit-font-smoothing:antialiased}
  html[dir="rtl"] body{font-family:'Amiri',Georgia,serif}
  .display{font-family:'Cormorant Garamond',serif}
  html[dir="rtl"] .display{font-family:'Amiri',serif}

  .top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
  .top .brand{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.28em;color:var(--gold)}
  html[dir="rtl"] .top .brand{letter-spacing:.06em}
  .langs{display:flex;gap:6px}
  .langs button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:system-ui,sans-serif;font-size:11px;padding:6px 12px;cursor:pointer}
  .langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}

  .hero{max-width:860px;margin:0 auto;padding:38px 22px 6px;text-align:center}
  .eyebrow{font-family:system-ui,sans-serif;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  html[dir="rtl"] .eyebrow{letter-spacing:.05em}
  h1{font-size:clamp(30px,6vw,52px);font-weight:600;margin:10px 0 14px;font-style:italic}
  html[dir="rtl"] h1{font-style:normal}
  .verse{font-size:17px;color:#cfc9bb;font-style:italic}
  html[dir="rtl"] .verse{font-style:normal}
  .vref{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--gold);letter-spacing:.1em;margin-top:6px}
  .lede{color:var(--muted);font-size:15px;max-width:640px;margin:16px auto 0}
  .hint{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--gold);margin-top:12px}

  .legende{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:18px;font-family:system-ui,sans-serif;font-size:12px;color:var(--muted)}
  .legende span{display:inline-flex;align-items:center;gap:7px}
  .legende i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legende i.vide{background:none;border:1.5px solid var(--muted)}

  .cielbox{max-width:900px;margin:6px auto 0;padding:0 8px}
  svg{width:100%;height:auto;display:block}
  .etoile-fond{fill:#e9e3d3}
  .arete{stroke-width:1;transition:stroke .25s,opacity .25s}
  .arete.afil{stroke:rgba(211,169,79,.16)}
  .arete.asalle{stroke:rgba(79,147,220,.13)}
  .arete.apilier{stroke:rgba(209,80,80,.13)}
  .arete.aentree{stroke:rgba(233,227,211,.05)}
  .arete.chaine{stroke:rgba(211,169,79,.30);stroke-width:1.5}
  .arete.on{stroke-width:1.9}
  .noeud{cursor:pointer;transition:opacity .25s}
  .noeud text{font-family:system-ui,sans-serif;font-size:13.5px;fill:var(--ink);opacity:.85;text-anchor:middle;transition:opacity .25s;paint-order:stroke;stroke:rgba(12,14,24,.75);stroke-width:3px}
  html[dir="rtl"] .noeud text{font-family:'Amiri',sans-serif;font-size:16px}
  .noeud.menu text{opacity:.66}
  .noeud.dim{opacity:.14}
  .noeud.sel text,.noeud.lie text{opacity:1}
  .noeud.sel circle.c{stroke:#fff;stroke-width:1.4}
  .centre text{font-family:'Cormorant Garamond',serif;font-size:22px;fill:var(--gold);text-anchor:middle}
  html[dir="rtl"] .centre text{font-family:'Amiri',serif}
  .centre{cursor:pointer;outline:none}
  .centre circle.souffle{pointer-events:none}
  .centre:focus-visible circle:not(.souffle){stroke-width:2.5}
  @media (prefers-reduced-motion:no-preference){
    .souffle{transform-box:fill-box;transform-origin:center;animation:souffle 7s ease-in-out infinite}
    @keyframes souffle{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    .scin{animation:scintille 4.5s ease-in-out infinite}
    @keyframes scintille{0%,100%{opacity:.08}50%{opacity:.45}}
    #ciel.lueur{animation:cielLueur 1.1s ease}
    @keyframes cielLueur{35%{filter:brightness(1.4)}}
  }

  .fiche{position:fixed;inset-inline:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:none;z-index:9;max-height:46vh;overflow-y:auto}
  .fiche.show{display:flex;flex-direction:column;gap:9px}
  .frang{display:flex;align-items:center;gap:14px}
  .fdesc{color:#c6c0b2;font-size:14.5px;line-height:1.6;max-width:640px}
  .fliens{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .fliens .fllbl{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  html[dir="rtl"] .fliens .fllbl{letter-spacing:.03em}
  .fliens button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-family:system-ui,sans-serif;font-size:12px;padding:5px 12px;cursor:pointer;transition:border-color .2s}
  .fliens button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fc,var(--muted))}
  .fliens button:hover{border-color:var(--fc,var(--gold))}
  .fiche .fdot{width:11px;height:11px;border-radius:50%;flex:none}
  .fiche .fnom{font-family:'Cormorant Garamond',serif;font-size:21px;flex:1;min-width:0}
  html[dir="rtl"] .fiche .fnom{font-family:'Amiri',serif}
  .fiche .ffam{display:block;font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  html[dir="rtl"] .fiche .ffam{letter-spacing:.03em}
  .fiche a.fgo,.fiche button.fgo{font-family:system-ui,sans-serif;font-size:13px;color:var(--gold);text-decoration:none;background:none;cursor:pointer;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:999px;padding:9px 16px;white-space:nowrap}
  .fiche button.fx{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
  .pchip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:system-ui,sans-serif;font-size:12px;padding:5px 12px}
  .pchip2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc,var(--muted))}
  .pchip2.lienor{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
  .pchip2.lienor::before{background:var(--gold)}
  .etq{font-family:system-ui,sans-serif;font-size:10.5px;fill:var(--muted);text-anchor:middle;letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:rgba(12,14,24,.8);stroke-width:3px;pointer-events:none}
  .etqarc{font-family:system-ui,sans-serif;font-size:10.5px;fill:var(--muted);letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
  html[dir="rtl"] .etqarc{font-family:'Amiri',serif;font-size:13px;letter-spacing:0;text-transform:none}
  .secteur{fill:rgba(233,227,211,.02);stroke:rgba(233,227,211,.09);stroke-width:1;cursor:pointer;transition:fill .25s}
  .secteur:hover,.secteur.sel{fill:rgba(233,227,211,.07)}
  .secteur.inerte{cursor:default;pointer-events:none}
  .secteur.inerte:hover{fill:rgba(233,227,211,.02)}
  .secteur.sel{stroke:rgba(211,169,79,.5)}
  .chemin{fill:none;stroke:rgba(211,169,79,.5);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .chemin.retour{stroke-dasharray:3 6;stroke-width:1.3;opacity:.8}
  .noeud.recit circle.c{stroke:var(--gold);stroke-width:1.3}
  .noeud.recit.sel circle.c{stroke:#fff}
  .fliens a.pchip2{text-decoration:none;cursor:pointer;color:var(--ink)}
  .fliens a.pchip2:hover{border-color:var(--gold)}
  html[dir="rtl"] .etq{font-family:'Amiri',serif;font-size:13px;letter-spacing:0;text-transform:none}
  .ariane{max-width:900px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center;gap:10px;font-family:system-ui,sans-serif;font-size:12.5px}
  .ariane a,.ariane button{background:none;border:none;padding:4px 2px;margin:0;color:var(--muted);font-family:system-ui,sans-serif;font-size:12.5px;cursor:pointer;text-decoration:none;transition:color .2s}
  .ariane a:hover,.ariane button:not(:disabled):hover{color:var(--gold)}
  .ariane button:disabled{color:var(--ink);cursor:default}
  .ariane .cran{color:var(--ink);padding:4px 2px}
  .ariane .sep{color:#5c6077;user-select:none}
  .cielbox,.legende,.hint{transition:opacity .23s ease}
  body.fondu .cielbox,body.fondu .legende,body.fondu .hint{opacity:0}

  footer{max-width:820px;margin:34px auto 120px;padding:22px 22px 0;border-top:1px solid var(--line);text-align:center;color:#5c6077;font-size:12.5px;font-family:system-ui,sans-serif;line-height:1.8}
</style>
</head>

let LANG="fr", SEL=null, SELL=null, SELC=null, SELE=null;
// l'adresse dit #livre (la salle s'appelle « Le livre », D-017) ; l'ancienne
// #bibliotheque reste comprise pour ne casser aucun lien déjà partagé
const normScene=h=>(h==='livre'||h==='bibliotheque')?'bibliotheque':((h==='correspondances'||h==='epoques')?h:'ciel');
let SCENE=normScene(location.hash.slice(1));
// le passage d'une scène à l'autre se fait en fondu — sauf si le lecteur
// préfère un mouvement réduit : alors la bascule est immédiate
function basculer(){
  if(!matchMedia('(prefers-reduced-motion: no-preference)').matches){bati();return;}
  document.body.classList.add('fondu');
  setTimeout(()=>{bati();document.body.classList.remove('fondu');},230);
}
function allerScene(sc){ if(sc===SCENE)return; SCENE=sc; fermer();
  if(sc==='ciel') history.pushState('', '', location.pathname);
  else location.hash=(sc==='bibliotheque')?'livre':sc;
  basculer(); }
window.addEventListener('hashchange',()=>{ const sc=normScene(location.hash.slice(1));
  if(sc!==SCENE){ SCENE=sc; fermer(); basculer(); } });
const S=(t)=>document.createElementNS("http://www.w3.org/2000/svg",t);
// petites étoiles de fond, déterministes
function alea(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function bati(){
  const svg=document.getElementById('ciel');svg.innerHTML='';
  // les lueurs : un dégradé par famille, réutilisé par toutes ses étoiles
  const defs=S('defs');
  for(const [fam,col] of Object.entries(Object.assign({agneau:"#d3a94f"},FAM))){
    const g=S('radialGradient');g.id='g-'+fam;
    [["0%","#ffffff",".9"],["30%",col,".55"],["100%",col,"0"]].forEach(([o,c,a])=>{
      const st=S('stop');st.setAttribute('offset',o);st.setAttribute('stop-color',c);
      st.setAttribute('stop-opacity',a);g.appendChild(st);});
    defs.appendChild(g);}
  svg.appendChild(defs);
  const r=alea(1517);
  for(let i=0;i<130;i++){const e=S('circle');
    const scin=i%9===0;
    e.setAttribute('class','etoile-fond'+(scin?' scin':''));
    e.setAttribute('cx',(r()*720).toFixed(1));e.setAttribute('cy',(r()*790).toFixed(1));
    e.setAttribute('r',(r()*1.1+0.3).toFixed(2));e.setAttribute('opacity',(r()*.25+.06).toFixed(2));
    if(scin)e.style.animationDelay=(r()*4.5).toFixed(1)+'s';
    svg.appendChild(e);}
  if(SCENE==='bibliotheque'){
    // un dégradé par période, plus un pour les livres hors carte
    const pals=Object.entries(CONSTEL.periodes).map(([k,p])=>[k,p.c]).concat([["mut","#9a94a8"]]);
    for(const [cle,col] of pals){
      const g2=S('radialGradient');g2.id='g-p-'+cle;
      [["0%",col,".95"],["40%",col,".45"],["100%",col,"0"]].forEach(([o,c2,a2])=>{
        const st=S('stop');st.setAttribute('offset',o);st.setAttribute('stop-color',c2);
        st.setAttribute('stop-opacity',a2);g2.appendChild(st);});
      defs.appendChild(g2);}
    const etoiles=batiBiblio(svg);
    poserCentre(svg);
    etoiles.forEach(([l,x,y])=>{
      const a=document.createElementNS("http://www.w3.org/2000/svg","a");
      a.setAttribute('href','salle-bibliotheque.html');
      a.setAttribute('class','noeud livre');a.dataset.livre=l[0];
      const per=l[2]&&l[2][0];
      const col=per?CONSTEL.periodes[per].c:'#9a94a8';
      const hl=S('circle');hl.setAttribute('cx',x);hl.setAttribute('cy',y);
      hl.setAttribute('r','15');hl.setAttribute('fill','url(#g-p-'+(per||'mut')+')');
      hl.setAttribute('opacity','.75');a.appendChild(hl);
      const pers=l[2]||[];
      if(pers.length>1){ // deux époques : deux demi-disques
        const cA=CONSTEL.periodes[pers[0]].c, cB=CONSTEL.periodes[pers[1]].c, xs=x.toFixed(1);
        const h1=S('path');h1.setAttribute('d',`M${xs} ${(y-6.2).toFixed(1)} A6.2 6.2 0 0 0 ${xs} ${(y+6.2).toFixed(1)} Z`);h1.setAttribute('fill',cA);a.appendChild(h1);
        const h2=S('path');h2.setAttribute('d',`M${xs} ${(y-6.2).toFixed(1)} A6.2 6.2 0 0 1 ${xs} ${(y+6.2).toFixed(1)} Z`);h2.setAttribute('fill',cB);a.appendChild(h2);
        const ring=S('circle');ring.setAttribute('class','c');ring.setAttribute('cx',x);ring.setAttribute('cy',y);
        ring.setAttribute('r','6.2');ring.setAttribute('fill','none');a.appendChild(ring);
      }else{
        const cc2=S('circle');cc2.setAttribute('class','c');cc2.setAttribute('cx',x);cc2.setAttribute('cy',y);
        cc2.setAttribute('r','6.2');cc2.setAttribute('fill',col);a.appendChild(cc2);}
      const cible=S('circle');cible.setAttribute('cx',x);cible.setAttribute('cy',y);cible.setAttribute('r','14');
      cible.setAttribute('fill','transparent');a.appendChild(cible);
      a.addEventListener('click',ev=>{ if(SELL!==l[0]){ev.preventDefault();choisirLivre(l[0]);} });
      svg.appendChild(a);});
    svg.querySelectorAll('.etqarc').forEach(t=>svg.appendChild(t));
    render();
    return;}
  if(SCENE==='correspondances'){
    // un dégradé par thème du fil rouge
    for(const [cle,th] of Object.entries(CONSTEL.themes)){
      const g2=S('radialGradient');g2.id='g-t-'+cle;
      [["0%","#ffffff",".85"],["32%",th.hex,".5"],["100%",th.hex,"0"]].forEach(([o,c2,a2])=>{
        const st=S('stop');st.setAttribute('offset',o);st.setAttribute('stop-color',c2);
        st.setAttribute('stop-opacity',a2);g2.appendChild(st);});
      defs.appendChild(g2);}
    const etoiles=batiCorr(svg);
    poserCentre(svg);
    etoiles.forEach(([n,x,y])=>{
      const co=CONSTEL.corr[n],th=CONSTEL.themes[co[0]];
      const a=document.createElementNS("http://www.w3.org/2000/svg","a");
      a.setAttribute('href','index.html#c='+(n+1));
      a.setAttribute('class','noeud corr');a.dataset.corr=n;
      const hl=S('circle');hl.setAttribute('cx',x);hl.setAttribute('cy',y);
      hl.setAttribute('r','11');hl.setAttribute('fill','url(#g-t-'+co[0]+')');
      hl.setAttribute('opacity','.7');a.appendChild(hl);
      const cc2=S('circle');cc2.setAttribute('class','c');cc2.setAttribute('cx',x);cc2.setAttribute('cy',y);
      cc2.setAttribute('r','4.8');cc2.setAttribute('fill',th.hex);a.appendChild(cc2);
      const cible=S('circle');cible.setAttribute('cx',x);cible.setAttribute('cy',y);cible.setAttribute('r','13');
      cible.setAttribute('fill','transparent');a.appendChild(cible);
      a.addEventListener('click',ev=>{ if(SELC!==n){ev.preventDefault();choisirCorr(n);} });
      svg.appendChild(a);});
    svg.querySelectorAll('.etq').forEach(t=>svg.appendChild(t));
    render();
    return;}
  if(SCENE==='epoques'){
    for(const [cle,p] of Object.entries(CONSTEL.periodes)){
      const g2=S('radialGradient');g2.id='g-p-'+cle;

const ETG_ORD=["loi","histoire","sagesse","grands","petits","deutero","evangiles","actes","paul","generales","apocalypse"];
function posC(r,deg){const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function batiBiblio(svg){

// ── Les époques : douze secteurs dans l'ordre du temps, l'Accomplissement en haut.
// Le chemin part du Christ et remonte (D-019) : d'Accomplissement en Maccabées,
// jusqu'aux origines, puis l'Église — la boucle d'Emmaüs. Les quatorze livres
// « récit » sont les étoiles cerclées d'or ; le fil d'or les relie dans cet ordre.
const RECIT=new Set(["genese","exode","nombres","josue","juges","1-samuel","2-samuel","1-rois","2-rois","esdras","nehemie","1-maccabees","luc","actes"]);
const CHEMIN=["christ","maccabees","retour","exil","division","royaume","juges","desert","exode","patriarches","origines","eglise"];
let SECTEURS={};
function arcPath(r,a1,a2,sens){ // sens 1 : horaire ; 0 : antihoraire (pour les étiquettes du bas)
  const A=posC(r,a1),B=posC(r,a2),large=Math.abs(a2-a1)>180?1:0;
  return `M${A[0].toFixed(1)} ${A[1].toFixed(1)} A${r} ${r} 0 ${large} ${sens} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`;}
function batiEpoques(svg){
  const cles=Object.keys(CONSTEL.periodes), par={};cles.forEach(k=>par[k]=[]);
  CONSTEL.livres.forEach(l=>{(l[2]||[]).forEach(p=>{ if(par[p]) par[p].push(l); });});
  // douze secteurs égaux — un cadran ; l'Accomplissement à midi (0° dans posC)
  const span=360/cles.length; let a=-(cles.indexOf('christ')*span)-span/2;
  const etoiles=[];SECTEURS={};
  cles.forEach((k,ci)=>{
    const a1=a, a2=a+span, am=a+span/2;
    const haut=Math.sin((am-90)*Math.PI/180)<0;
    SECTEURS[k]={a1,a2,am,len:(haut?318:328)*span*Math.PI/180};
    // le cadre du secteur
    const P=S('path');P.setAttribute('class','secteur');P.dataset.p=k;
    const o1=posC(300,a1),o2=posC(300,a2),i1=posC(150,a1),i2=posC(150,a2),large=span>180?1:0;
    P.setAttribute('d',`M${o1[0].toFixed(1)} ${o1[1].toFixed(1)} A300 300 0 ${large} 1 ${o2[0].toFixed(1)} ${o2[1].toFixed(1)} L${i2[0].toFixed(1)} ${i2[1].toFixed(1)} A150 150 0 ${large} 0 ${i1[0].toFixed(1)} ${i1[1].toFixed(1)} Z`);
    P.addEventListener('click',()=>choisirEpoque(k));svg.appendChild(P);
    // l'étiquette sur l'arc — retournée dans la moitié basse pour se lire à l'endroit
    const dp=S('path');dp.id='arc-'+k;dp.setAttribute('fill','none');
    dp.setAttribute('d',haut?arcPath(318,a1,a2,1):arcPath(328,a2,a1,0));defs_of(svg).appendChild(dp);
    const tx=S('text');tx.setAttribute('class','etqarc');tx.dataset.p=k;
    const tp=S('textPath');tp.setAttribute('href','#arc-'+k);tp.setAttribute('startOffset','50%');
    tp.setAttribute('text-anchor','middle');tx.appendChild(tp);svg.appendChild(tx);
    // les étoiles : les livres de l'époque, le récit d'abord
    const livres=par[k].slice().sort((x,y)=>(RECIT.has(y[0])?1:0)-(RECIT.has(x[0])?1:0));
    const cols=Math.max(1,Math.ceil(livres.length/5)), pad=Math.min(span*0.14,5);
    livres.forEach((l,j)=>{const col=j%cols,row=(j/cols)|0;
      const ang=a1+pad+(col+0.5)*(span-2*pad)/cols, ray=176+row*26;
      const xy=posC(ray,ang);etoiles.push([l,xy[0],xy[1],k,RECIT.has(l[0])]);});
    a+=span;});
  // le chemin : le fil d'or à travers les livres du récit, du Christ vers les origines, puis l'Église
  const pts=[];CHEMIN.forEach(k=>{ const r=etoiles.filter(e=>e[3]===k&&e[4]).sort((x,y)=>CONSTEL.livres.indexOf(y[0])-CONSTEL.livres.indexOf(x[0]));
    r.forEach(e=>pts.push(e[1].toFixed(1)+','+e[2].toFixed(1))); });
  const pl=S('polyline');pl.setAttribute('class','chemin');pl.setAttribute('points',pts.join(' '));svg.appendChild(pl);
  // … et l'on revient au Christ : d'Actes à Luc, en pointillé — la boucle se referme
  if(pts.length>1){const [x1,y1]=pts[pts.length-1].split(','),[x2,y2]=pts[0].split(',');
    const rt=S('line');rt.setAttribute('class','chemin retour');
    rt.setAttribute('x1',x1);rt.setAttribute('y1',y1);rt.setAttribute('x2',x2);rt.setAttribute('y2',y2);svg.appendChild(rt);}
  return etoiles;
}

  const lg=document.getElementById('legende');
  if(SCENE==='bibliotheque'||SCENE==='epoques'){
    lg.innerHTML=Object.values(CONSTEL.periodes).map(p=>
      `<span><i style="background:${p.c}"></i>${p[LANG]}</span>`).join('')+
      (CONSTEL.livres.some(l=>!l[2])?`<span><i class="vide"></i>${c.horsCarte}</span>`:'');
  }else if(SCENE==='correspondances'){
    lg.innerHTML=Object.values(CONSTEL.themes).map(t=>
      `<span><i style="background:${t.hex}"></i>${t.nom[LANG]}</span>`).join('');
  }else{
    lg.innerHTML=
      `<span><i style="background:${FAM.fil}"></i>${c.fams.fil}</span>`+
      `<span><i style="background:${FAM.salle}"></i>${c.fams.salle}</span>`+
      `<span><i style="background:${FAM.pilier}"></i>${c.fams.pilier}</span>`+
      `<span><i class="vide"></i>${c.fams.entree}</span>`;
  }
  document.getElementById('ariane').setAttribute('aria-label',c.arianeLbl);
  document.getElementById('arAgneau').textContent=c.arianeAgneau;
  document.getElementById('arSep1').textContent=c.arianeSep;
  document.getElementById('arSep2').textContent=c.arianeSep;
  const enCiel=(SCENE==='ciel');
  const ac=document.getElementById('arCiel');ac.textContent=c.arianeCiel;ac.disabled=enCiel;
  if(enCiel)ac.setAttribute('aria-current','page');else ac.removeAttribute('aria-current');
  document.getElementById('arSep2').hidden=enCiel;
  const cr=document.getElementById('arConst');cr.hidden=enCiel;
  if(!enCiel)cr.textContent=(SCENE==='bibliotheque')?c.noms.bibliotheque:(SCENE==='epoques'?c.epoquesNom:c.corrNom);
  const ct=document.getElementById('centreTxt');if(ct)ct.textContent=c.centre;
  const cs=document.getElementById('centreSub');if(cs)cs.textContent=c.centreSub;
  const gc=document.querySelector('.centre');if(gc)gc.setAttribute('aria-label',c.centreA11y);
  document.querySelectorAll('.etqarc').forEach(t=>{const k=t.dataset.p||t.dataset.k, tp=t.firstChild;
    tp.textContent=t.dataset.p?(CHEMIN.indexOf(k)+1)+' · '+CONSTEL.periodes[k][LANG]:CONSTEL.etageres[k][LANG];
    t.style.fontSize='';tp.removeAttribute('textLength');tp.removeAttribute('lengthAdjust');
    const arc=(SECTEURS[k]&&SECTEURS[k].len)||160;let len=tp.getComputedTextLength();
    if(len>arc-8){const fs0=parseFloat(getComputedStyle(t).fontSize)||10.5;
      t.style.fontSize=Math.max(7.5,fs0*(arc-8)/len)+'px';len=tp.getComputedTextLength();}
    if(len>arc-6){tp.setAttribute('textLength',(arc-6).toFixed(1));tp.setAttribute('lengthAdjust','spacingAndGlyphs');}});
  document.querySelectorAll('.etq').forEach(t=>{
    t.textContent=t.dataset.t?CONSTEL.themes[t.dataset.t].nom[LANG]:CONSTEL.etageres[t.dataset.k][LANG];
    t.setAttribute('x',t.dataset.x);
    const bb=t.getBBox();
    if(bb.x<4)t.setAttribute('x',+t.dataset.x+(4-bb.x));
    else if(bb.x+bb.width>716)t.setAttribute('x',+t.dataset.x-(bb.x+bb.width-716));});
  const li={fr:0,en:1,ar:2}[LANG];
  document.querySelectorAll('.noeud').forEach(n=>{
    if(n.dataset.corr){n.setAttribute('aria-label',CONSTEL.corr[+n.dataset.corr][li+1][0]);return;}
    if(n.dataset.livre){const lv=CONSTEL.livres.find(x=>x[0]===n.dataset.livre);
      if(lv)n.setAttribute('aria-label',lv[3][li]);return;}
    const t=n.querySelector('text');if(t)t.textContent=c.noms[n.dataset.k];
    n.setAttribute('aria-label',c.pleins[n.dataset.k]);});
  document.getElementById('foot').innerHTML=c.foot;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG?'true':'false'));
  if(SCENE==='ciel'&&SEL)choisir(SEL);
  if(SCENE==='bibliotheque'&&SELL)choisirLivre(SELL);
  if(SCENE==='correspondances'&&SELC!=null)choisirCorr(SELC);
  if(SCENE==='epoques'&&SELE)choisirEpoque(SELE);
}
document.getElementById('fx').addEventListener('click',fermer);
document.getElementById('arCiel').addEventListener('click',()=>allerScene('ciel'));
document.getElementById('ciel').addEventListener('animationend',e=>{
  if(e.animationName==='cielLueur')document.getElementById('ciel').classList.remove('lueur');});
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.l)));
bati();
</script>
</body>
</html>
