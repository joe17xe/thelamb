let LANG="fr", SEL=null;
const S=(t)=>document.createElementNS("http://www.w3.org/2000/svg",t);
// petites étoiles de fond, déterministes
function alea(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function bati(){
  const svg=document.getElementById('ciel');svg.innerHTML='';
  // les lueurs : un dégradé par famille, réutilisé par toutes ses étoiles
  const defs=S('defs');
  for(const [fam,col] of Object.entries(Object.assign({agneau:"#d3a94f"},FAM))){
    const g=S('radialGradient');g.id='g-'+fam;
    [["0%","#ffffff",".9"],["30%",col,".55"],["100%",col,"0"]].forEach(([o,c,a])=>{
      const st=S('stop');st.setAttribute('offset',o);st.setAttribute('stop-color',c);
      st.setAttribute('stop-opacity',a);g.appendChild(st);});
    defs.appendChild(g);}
  svg.appendChild(defs);
  const r=alea(1517);
  for(let i=0;i<130;i++){const e=S('circle');
    const scin=i%9===0;
    e.setAttribute('class','etoile-fond'+(scin?' scin':''));
    e.setAttribute('cx',(r()*720).toFixed(1));e.setAttribute('cy',(r()*790).toFixed(1));
    e.setAttribute('r',(r()*1.1+0.3).toFixed(2));e.setAttribute('opacity',(r()*.25+.06).toFixed(2));
    if(scin)e.style.animationDelay=(r()*4.5).toFixed(1)+'s';
    svg.appendChild(e);}
  const par={};NOEUDS.forEach(nd=>par[nd.k]=nd);
  ARETES.forEach(([a,b])=>{
    const l=S('line');const A=par[a].p,B=par[b].p;
    l.setAttribute('x1',A[0]);l.setAttribute('y1',A[1]);l.setAttribute('x2',B[0]);l.setAttribute('y2',B[1]);
    const rang={fil:0,salle:1,pilier:2,entree:3};
    const dom=rang[par[a].fam]<=rang[par[b].fam]?par[a].fam:par[b].fam;
    l.setAttribute('class','arete a'+dom+(CHAINE.has([a,b].sort().join('|'))?' chaine':''));
    l.dataset.a=a;l.dataset.b=b;svg.appendChild(l);});
  // le centre : l'Agneau, en respiration lente
  const g=S('g');g.setAttribute('class','centre');
  const halo=S('circle');halo.setAttribute('class','souffle');
  halo.setAttribute('cx',CX);halo.setAttribute('cy',CY);halo.setAttribute('r',105);
  halo.setAttribute('fill','url(#g-agneau)');halo.setAttribute('opacity','.35');g.appendChild(halo);
  const cc=S('circle');cc.setAttribute('cx',CX);cc.setAttribute('cy',CY);cc.setAttribute('r',47);
  cc.setAttribute('fill','#171320');cc.setAttribute('stroke','var(--gold)');cc.setAttribute('stroke-width','1.5');g.appendChild(cc);
  const ct=S('text');ct.setAttribute('x',CX);ct.setAttribute('y',CY+8);ct.id='centreTxt';g.appendChild(ct);
  const cs=S('text');cs.setAttribute('x',CX);cs.setAttribute('y',CY+70);cs.id='centreSub';
  cs.setAttribute('style','font-family:system-ui;font-size:11px;fill:var(--muted);text-anchor:middle');g.appendChild(cs);
  svg.appendChild(g);
  // les nœuds
  NOEUDS.forEach(nd=>{
    const a=document.createElementNS("http://www.w3.org/2000/svg","a");
    a.setAttribute('href',nd.href);a.setAttribute('class','noeud'+(nd.deg<3?' menu':''));a.dataset.k=nd.k;
    const [x,y]=nd.p;
    const base=nd.fam==='fil'?7.5:nd.fam==='salle'?7:nd.fam==='pilier'?6:6;
    const rr=Math.min(base+nd.deg*1.1, base+9);
    const hl=S('circle');hl.setAttribute('cx',x);hl.setAttribute('cy',y);
    hl.setAttribute('r',(rr*2.9).toFixed(1));hl.setAttribute('fill','url(#g-'+nd.fam+')');
    hl.setAttribute('opacity',nd.fam==='entree'?'.35':'.8');a.appendChild(hl);
    const c=S('circle');c.setAttribute('class','c');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',rr);
    if(nd.fam==='entree'){c.setAttribute('fill','rgba(12,14,24,.6)');c.setAttribute('stroke',COEUR.entree);c.setAttribute('stroke-width','1.4');}
    else c.setAttribute('fill',COEUR[nd.fam]);
    a.appendChild(c);
    const cible=S('circle');cible.setAttribute('cx',x);cible.setAttribute('cy',y);cible.setAttribute('r',26);
    cible.setAttribute('fill','transparent');a.appendChild(cible);
    const t=S('text');t.setAttribute('x',x);t.setAttribute('y',y+rr+17);a.appendChild(t);
    a.addEventListener('click',ev=>{ if(SEL!==nd.k){ev.preventDefault();choisir(nd.k);} });
    svg.appendChild(a);});
  render();
}
function choisir(k){
  SEL=k;const c=C[LANG];const nd=NOEUDS.find(n=>n.k===k);
  document.querySelectorAll('.noeud').forEach(n=>{
    const lie=n.dataset.k===k||ARETES.some(([a,b])=>(a===k&&b===n.dataset.k)||(b===k&&a===n.dataset.k));
    n.classList.toggle('sel',n.dataset.k===k);
    n.classList.toggle('lie',lie&&n.dataset.k!==k);
    n.classList.toggle('dim',!lie);});
  document.querySelectorAll('.arete').forEach(l=>{
    const on=l.dataset.a===k||l.dataset.b===k;
    l.classList.toggle('on',on);
    l.style.stroke=on?FAM[nd.fam]:'';l.style.opacity=on?'':'0.35';});
  document.getElementById('fdot').style.background=FAM[nd.fam];
  document.getElementById('ffam').textContent=c.fams[nd.fam];
  document.getElementById('fnom').textContent=c.pleins[k];
  const go=document.getElementById('fgo');go.textContent=c.go;go.href=nd.href;
  document.getElementById('fdesc').textContent=c.descs[k]||'';
  const fl=document.getElementById('fliens');fl.innerHTML='';
  const lb=document.createElement('span');lb.className='fllbl';lb.textContent=c.flien;fl.appendChild(lb);
  ARETES.filter(([a,b])=>a===k||b===k).forEach(([a,b])=>{
    const autre=a===k?b:a, fam=NOEUDS.find(x=>x.k===autre).fam;
    const bt=document.createElement('button');bt.type='button';bt.textContent=c.noms[autre];
    bt.style.setProperty('--fc',FAM[fam]);
    bt.addEventListener('click',()=>choisir(autre));
    fl.appendChild(bt);});
  document.getElementById('fiche').classList.add('show');
}
function fermer(){
  SEL=null;
  document.querySelectorAll('.noeud').forEach(n=>n.classList.remove('sel','lie','dim'));
  document.querySelectorAll('.arete').forEach(l=>{l.classList.remove('on');l.style.stroke='';l.style.opacity='';});
  document.getElementById('fiche').classList.remove('show');
}
function render(l){
  if(l)LANG=l;
  const c=C[LANG];
  document.documentElement.lang=LANG;document.documentElement.dir=c.dir;
  document.getElementById('brand').textContent=c.brand;
  document.getElementById('eyebrow').textContent=c.eyebrow;
  document.getElementById('h1').textContent=c.h1;
  document.getElementById('verse').textContent=c.verse;
  document.getElementById('vref').textContent=c.vref;
  document.getElementById('lede').textContent=c.lede;
  document.getElementById('hint').textContent=c.hint;
  document.getElementById('legende').innerHTML=
    `<span><i style="background:${FAM.fil}"></i>${c.fams.fil}</span>`+
    `<span><i style="background:${FAM.salle}"></i>${c.fams.salle}</span>`+
    `<span><i style="background:${FAM.pilier}"></i>${c.fams.pilier}</span>`+
    `<span><i class="vide"></i>${c.fams.entree}</span>`;
  const ct=document.getElementById('centreTxt');if(ct)ct.textContent=c.centre;
  const cs=document.getElementById('centreSub');if(cs)cs.textContent=c.centreSub;
  document.querySelectorAll('.noeud').forEach(n=>{
    const t=n.querySelector('text');if(t)t.textContent=c.noms[n.dataset.k];
    n.setAttribute('aria-label',c.pleins[n.dataset.k]);});
  document.getElementById('foot').innerHTML=c.foot;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG?'true':'false'));
  if(SEL)choisir(SEL);
}
document.getElementById('fx').addEventListener('click',fermer);
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.l)));
bati();
</script>
