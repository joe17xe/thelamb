name: Vérifier le site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un seul script, ici comme sur le poste d'un contributeur :
      # `bash outils/tout-verifier.sh` donne exactement ce verdict.
      - name: Les contrôles du dépôt
        run: bash outils/tout-verifier.sh
