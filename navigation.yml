# navigation.yml — la structure du site, en donnée
#
# Source de vérité du maillage. `outils/verifier-liens.py` compare le site réel à
# ce fichier : toute page nouvelle doit s'y déclarer avec ce qui y mène et ce vers
# quoi elle repart, sinon elle devient orpheline.
#
# Cette carte n'a pas été inventée : elle reprend l'intention déjà inscrite dans
# les pages. Chacune portait son bloc « page suivante », rédigé et traduit dans
# les trois langues, mais avec `href="#"` — le chemin était écrit, jamais relié.
#
#   racine  : seule page dont on n'attend aucun lien entrant
#   suite   : la page vers laquelle on repart (pas de cul-de-sac)
#   annexes : liens secondaires légitimes

accueil:
  fichier: index.html
  role: Le Fil Rouge — les Écritures se répondent
  racine: true
  suite: page-fondatrice-emmaus.html
  annexes:
    - salle-bibliotheque.html
    - section-bible-fiable.html
    - frise-prophetes.html
    - salle-trinite.html
    - section-offrande.html
    - carte-du-ciel.html

seuil:
  fichier: seuil-landing.html
  role: Le seuil — une porte, vers Emmaüs
  # Entrée depuis l'extérieur : aucune page du site n'y mène, et c'est voulu.
  # Un lecteur déjà entré n'a pas à repasser par la porte (décision D-015).
  racine: true
  suite: page-fondatrice-emmaus.html
  annexes:
    - index.html

carte:
  fichier: carte-du-ciel.html
  role: La carte du ciel — toutes les pages, l'Agneau au centre
  # La carte relie tout : chaque nœud est un lien. Ses arêtes suivent ce fichier,
  # dédoublonnées — la carte est mesurée, pas dessinée.
  suite: page-fondatrice-emmaus.html
  annexes:
    - index.html
    - seuil-landing.html
    - page-etalon-voici-agneau.html
    - page-etape2-agneau-regne.html
    - page-etape3-la-croix.html
    - page-etape4-isaie-53.html
    - page-etape5-la-paque.html
    - page-etape6-morija.html
    - page-etape7-commencement.html
    - salle-trinite.html
    - salle-trinite-bibliotheques.html
    - salle-bibliotheque.html
    - section-offrande.html
    - section-bible-fiable.html
    - frise-prophetes.html
    - cle-deja-pas-encore.html
    - pilier-le-sang.html
    - pilier-bapteme.html
    - pilier-parole-eternelle.html
    - pilier-resurrection.html
    - pilier-temple-detruit.html
    - pilier-transfiguration.html

methode:
  fichier: page-fondatrice-emmaus.html
  role: La route d'Emmaüs — la méthode du site, et la porte du parcours
  suite: section-bible-fiable.html
  annexes: [page-etalon-voici-agneau.html]

# ————— Le parcours de l'Agneau : la colonne vertébrale, en remontée —————
parcours:
  role: Le fil de l'Agneau — sept étapes, du Christ vers la Genèse
  chaine:
    - fichier: page-etalon-voici-agneau.html
      suite: page-etape2-agneau-regne.html
    - fichier: page-etape2-agneau-regne.html
      suite: page-etape3-la-croix.html
      annexes: [pilier-resurrection.html, cle-deja-pas-encore.html]
    - fichier: page-etape3-la-croix.html
      suite: page-etape4-isaie-53.html
      annexes: [pilier-le-sang.html]
    - fichier: page-etape4-isaie-53.html
      suite: page-etape5-la-paque.html
    - fichier: page-etape5-la-paque.html
      suite: page-etape6-morija.html
    - fichier: page-etape6-morija.html
      suite: page-etape7-commencement.html
    - fichier: page-etape7-commencement.html
      suite: index.html

# ————— Les piliers : deux fils d'approfondissement, ouverts depuis le parcours —————
piliers:
  role: Six approfondissements, en deux chaînes
  pages:
    # chaîne ouverte par la salle de la Trinité
    - fichier: pilier-bapteme.html
      suite: pilier-transfiguration.html
    - fichier: pilier-transfiguration.html
      suite: pilier-parole-eternelle.html
      annexes: [page-fondatrice-emmaus.html]  # la montagne annonce, la route interprète
    - fichier: pilier-parole-eternelle.html
      suite: index.html
    # chaîne ouverte par l'étape 2, sur l'Agneau vivant
    - fichier: pilier-resurrection.html
      suite: pilier-temple-detruit.html
    - fichier: pilier-temple-detruit.html
      suite: index.html
    # ouvert par l'étape 3, sur la croix
    - fichier: pilier-le-sang.html
      suite: section-offrande.html

sections:
  - fichier: section-offrande.html
    role: L'Offrande — de la Pâque à la table du Seigneur
    suite: section-bible-fiable.html
  - fichier: section-bible-fiable.html
    role: Une Bible digne de confiance
    suite: page-fondatrice-emmaus.html

salles:
  - fichier: salle-trinite.html
    role: Le Père, le Fils et l'Esprit
    suite: pilier-bapteme.html
    annexes: [salle-trinite-bibliotheques.html]
  - fichier: salle-trinite-bibliotheques.html
    role: La grande salle — les bibliothèques de la Trinité
    suite: salle-trinite.html
  - fichier: salle-bibliotheque.html
    role: Comment la Bible est composée
    suite: index.html
    annexes: [section-bible-fiable.html]

transversales:
  - fichier: frise-prophetes.html
    role: Les veilleurs — mille ans d'annonces
    suite: page-etape4-isaie-53.html
    annexes: [pilier-transfiguration.html]
  - fichier: cle-deja-pas-encore.html
    role: Déjà / Pas encore — la clé de lecture
    suite: index.html

# Les ateliers : publiés pour être ouverts depuis un téléphone, mais hors du
# parcours du lecteur. Ils ne mènent nulle part et personne n'y mène : c'est
# voulu, et déclaré ici pour qu'on ne le prenne pas pour un oubli.
ateliers:
  - fichier: validation-liens.html
    role: Valider la nature des 153 liens du fil rouge (R-013)
