# navigation.yml — la structure du site, en donnée
#
# PROPOSITION — à valider avant exécution. Ce fichier est la source de vérité du
# maillage : `outils/verifier-liens.py` compare le site réel à ce qui est déclaré ici.
# Toute page nouvelle doit s'y déclarer, sinon elle devient orpheline.
#
# entree      : la page depuis laquelle on arrive (obligatoire, sauf pour l'accueil)
# suite       : la page vers laquelle on repart (obligatoire — pas de cul-de-sac)
# annexes     : liens secondaires légitimes, non obligatoires

accueil:
  fichier: index.html
  role: Le Fil Rouge — les Écritures se répondent
  entree: ~                      # racine du site
  suite: page-etalon-voici-agneau.html
  annexes:
    - seuil-landing.html
    - section-bible-fiable.html
    - page-fondatrice-emmaus.html   # comment lire ce site
    - cle-deja-pas-encore.html

seuil:
  fichier: seuil-landing.html
  role: Le seuil — une porte, des salles
  entree: index.html
  suite: page-etalon-voici-agneau.html
  annexes: [salle-bibliotheque.html, salle-trinite.html, section-offrande.html]

methode:
  fichier: page-fondatrice-emmaus.html
  role: La route d'Emmaüs — la méthode du site
  entree: index.html
  suite: page-etalon-voici-agneau.html
  annexes: [section-bible-fiable.html]

# ————— Le parcours de l'Agneau : la colonne vertébrale, en remontée —————
parcours:
  role: Le fil de l'Agneau — sept étapes, du Christ vers la Genèse
  entree: index.html
  chaine:
    - fichier: page-etalon-voici-agneau.html
      approfondit: pilier-bapteme.html        # Jean 1:29 est dit au Jourdain
    - fichier: page-etape2-agneau-regne.html
      approfondit: pilier-resurrection.html   # l'Agneau debout, comme immolé
    - fichier: page-etape3-la-croix.html
      approfondit: pilier-le-sang.html
    - fichier: page-etape4-isaie-53.html
      approfondit: frise-prophetes.html       # mille ans d'annonces
    - fichier: page-etape5-la-paque.html
      approfondit: section-offrande.html
    - fichier: page-etape6-morija.html
      approfondit: pilier-temple-detruit.html # Morija devient la colline du Temple
    - fichier: page-etape7-commencement.html
      approfondit: pilier-parole-eternelle.html
  suite: index.html

# ————— Les piliers : approfondissements, atteints depuis une étape —————
piliers:
  role: Six approfondissements rattachés au parcours
  pages:
    - fichier: pilier-bapteme.html
      entree: page-etalon-voici-agneau.html
      suite: page-etalon-voici-agneau.html
    - fichier: pilier-resurrection.html
      entree: page-etape2-agneau-regne.html
      suite: page-etape2-agneau-regne.html
    - fichier: pilier-le-sang.html
      entree: page-etape3-la-croix.html
      suite: section-offrande.html
    - fichier: pilier-temple-detruit.html
      entree: page-etape6-morija.html
      suite: page-etape6-morija.html
    - fichier: pilier-parole-eternelle.html
      entree: page-etape7-commencement.html
      suite: salle-trinite.html
    - fichier: pilier-transfiguration.html
      entree: frise-prophetes.html            # Moïse et Élie : la Loi et les Prophètes
      suite: page-etape4-isaie-53.html

# ————— Les sections —————
sections:
  - fichier: section-bible-fiable.html
    role: Une Bible digne de confiance
    entree: index.html
    suite: salle-bibliotheque.html
  - fichier: section-offrande.html
    role: L'Offrande — de la Pâque à la table du Seigneur
    entree: page-etape5-la-paque.html
    suite: page-etape5-la-paque.html

# ————— Les salles —————
salles:
  - fichier: salle-bibliotheque.html
    role: Comment la Bible est composée
    entree: section-bible-fiable.html
    suite: section-bible-fiable.html
  - fichier: salle-trinite.html
    role: Le Père, le Fils et l'Esprit
    entree: pilier-parole-eternelle.html
    suite: salle-trinite-bibliotheques.html
  - fichier: salle-trinite-bibliotheques.html
    role: Les bibliothèques de la Trinité
    entree: salle-trinite.html
    suite: salle-trinite.html

# ————— Les transversales —————
transversales:
  - fichier: frise-prophetes.html
    role: Les veilleurs — mille ans d'annonces
    entree: page-etape4-isaie-53.html
    suite: page-etape4-isaie-53.html
    annexes: [pilier-transfiguration.html]
  - fichier: cle-deja-pas-encore.html
    role: Déjà / Pas encore — la clé de lecture
    entree: index.html
    suite: page-etape2-agneau-regne.html

# ————— À retirer —————
obsoletes:
  - fichier: prototype-fil-rouge-v3.html
    raison: coquille de 21 mots, remplacée par index.html
