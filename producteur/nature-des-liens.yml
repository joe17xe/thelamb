# nature-des-liens.yml — de quelle nature est chacun des 153 liens
#
# Donnée de travail du chantier R-013. Chaque correspondance du fil rouge reçoit
# une nature au sens de la décision D-013, et l'indice qui la justifie.
#
#   propose : la proposition de Claude — cite · allu · echo · lect · debat
#   statut  : « à valider » tant que le porteur ne s'est pas prononcé, « validé » ensuite
#   tradition / mention : décision D-021 — la lecture part de la tradition catholique
#                         et porte toujours une mention pour les autres Églises
#
# La page `validation-liens.html` se génère depuis ce fichier :
#
#     python3 outils/poser-validation.py
#
# Rien de ce fichier n'atteint le site tant que `statut` n'est pas « validé ».

natures:
  cite:  {fr: "Citation explicite",            en: "Explicit quotation",           ar: "اقتباس صريح"}
  allu:  {fr: "Allusion largement reconnue",   en: "Widely recognised allusion",   ar: "تلميح معترَف به على نطاق واسع"}
  echo:  {fr: "Écho thématique",               en: "Thematic echo",                ar: "صدى موضوعي"}
  lect:  {fr: "Lecture chrétienne",            en: "Christian reading",            ar: "قراءة مسيحية"}
  debat: {fr: "Débat interprétatif",           en: "Interpretive debate",          ar: "جدل تفسيري"}

