<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les veilleurs — mille ans d'annonces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0e18;--bg2:#11141f;--ink:#e9e3d3;--muted:#9a94a8;--gold:#d3a94f;--line:#23273a;--crimson:#a33;
}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;line-height:1.6}
  html[dir="rtl"] body{font-family:'Amiri',serif;line-height:1.9}
  .display{font-family:'Cormorant Garamond',serif;font-weight:500}
  html[dir="rtl"] .display{font-family:'Amiri',serif;font-weight:700}
  .ui{font-family:system-ui,sans-serif}
  .top{max-width:1160px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .brand{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.34em;color:var(--gold)}
  .langs{display:flex;gap:6px}
  .langs button{font-family:system-ui,sans-serif;font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:6px 12px;cursor:pointer}
  .langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}
  .hero{max-width:820px;margin:0 auto;padding:48px 22px 20px;text-align:center}
  .eyebrow{font-family:system-ui,sans-serif;font-size:11.5px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;margin-bottom:16px}
  html[dir="rtl"] .eyebrow{letter-spacing:.05em}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,5.5vw,50px);line-height:1.12}
  html[dir="rtl"] h1{font-family:'Amiri',serif;font-weight:700}
  h1 em{font-style:italic;color:var(--gold)}
  .lede{max-width:640px;margin:16px auto 0;color:var(--muted);font-size:16px}
  /* Les 6 grandes phases — "l'AT expliqué" */
  .phases{max-width:1160px;margin:24px auto 0;padding:0 16px}
  .ptitle{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:16px}
  html[dir="rtl"] .ptitle{letter-spacing:.05em}
  .pflow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:860px){.pflow{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.pflow{grid-template-columns:1fr}}
  .phase{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--pc,var(--gold));border-radius:8px;padding:14px 14px}
  .phase .pnum{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.2em;color:var(--pc,var(--gold))}
  .phase h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;margin:4px 0 2px}
  html[dir="rtl"] .phase h3{font-family:'Amiri',serif}
  .phase .pdate{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);margin-bottom:6px}
  .phase p{font-size:13px;color:#c6c0b2}
  .phase .pwho{font-style:italic;color:var(--gold);font-size:12.5px;margin-top:6px;display:block}
  html[dir="rtl"] .phase .pwho{font-style:normal}
  /* Frise des prophètes */
  .filter{max-width:1160px;margin:34px auto 6px;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .fchip{font-family:system-ui,sans-serif;font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .fchip .d{width:8px;height:8px;border-radius:50%;background:var(--c,#888)}
  .fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--c,var(--gold));background:color-mix(in srgb,var(--c,#888) 12%,transparent)}
  .timeline{max-width:1160px;margin:14px auto 0;padding:0 16px}
  .tlwrap{position:relative;overflow-x:auto;padding:20px 0 8px}
  .axis{position:relative;height:2px;min-width:900px;margin:0 10px}
  .tick{position:absolute;top:-6px;width:1px;height:14px;background:var(--line)}
  .tlabel{position:absolute;top:14px;font-family:system-ui,sans-serif;font-size:10px;color:#6b6f85;transform:translateX(-50%);white-space:nowrap}
  .prow{position:relative;min-width:900px;margin:26px 10px 0;height:auto}
  .pnode{position:absolute;transform:translateX(-50%);width:96px;text-align:center;cursor:pointer}
  html[dir="rtl"] .pnode{transform:translateX(50%)}
  .pnode .dot{width:13px;height:13px;border-radius:50%;background:var(--c,var(--gold));margin:0 auto 5px;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--c,var(--gold));transition:transform .15s}
  .pnode:hover .dot{transform:scale(1.35)}
  .pnode .pn{font-family:'Cormorant Garamond',serif;font-size:15px;line-height:1.1}
  html[dir="rtl"] .pnode .pn{font-family:'Amiri',serif}
  .pnode .pd{font-family:system-ui,sans-serif;font-size:9.5px;color:var(--muted)}
  .pnode.dim{opacity:.2}
  .rows{position:relative}
  /* Panneau détail */
  .panel{max-width:820px;margin:30px auto 0;padding:0 18px;min-height:80px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:26px 28px;position:relative;overflow:hidden;opacity:0;transform:translateY(8px);transition:.4s}
  .card.show{opacity:1;transform:none}
  .card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--pc,var(--gold))}
  .card .badge{display:inline-block;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--pc,var(--gold));border:1px solid color-mix(in srgb,var(--pc,var(--gold)) 45%,transparent);border-radius:999px;padding:4px 12px;margin-bottom:12px}
  html[dir="rtl"] .card .badge{letter-spacing:.04em}
  .card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(24px,4vw,32px);margin-bottom:2px}
  html[dir="rtl"] .card h2{font-family:'Amiri',serif;font-weight:700}
  .card .when{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
  html[dir="rtl"] .card .when{letter-spacing:.03em}
  .card .lbl{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
  html[dir="rtl"] .card .lbl{letter-spacing:.03em}
  .card .ctx{font-size:15px;color:#cfc9bb}
  .card .msg{font-size:16.5px}
  .card .link{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .card .link .ref{color:var(--gold);font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.08em}
  .card .link p{font-style:italic;font-size:15px;margin-top:3px}
  html[dir="rtl"] .card .link p{font-style:normal}
  .placeholder{text-align:center;color:#5c6077;font-family:system-ui,sans-serif;font-size:13px;padding:24px 0}
  footer{max-width:820px;margin:34px auto 46px;padding:22px 22px 0;border-top:1px solid var(--line);color:#5c6077;font-size:12.5px;font-family:system-ui,sans-serif;text-align:center;line-height:1.8}

  /* liens secondaires — vers ce que la frise ouvre sans y conduire */
  /* la remontée des générations */
  .gens{max-width:1160px;margin:46px auto 0;padding:0 22px}
  .gens .gh{font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:8px}
  html[dir="rtl"] .gens .gh{font-family:'Amiri',serif}
  .gens .gp{color:var(--muted);font-size:15px;max-width:760px;margin-bottom:18px}
  .chaine{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .maillon{border:1px solid color-mix(in srgb,var(--pc,var(--gold)) 55%,transparent);border-radius:999px;padding:6px 13px;display:inline-flex;align-items:baseline;gap:7px;background:var(--bg2)}
  .maillon::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--gold));align-self:center}
  .maillon .mn{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink)}
  html[dir="rtl"] .maillon .mn{font-family:'Amiri',serif}
  .maillon .mq{font-family:system-ui,sans-serif;font-size:10.5px;color:var(--muted)}
  .maillon.fourche{border-style:dashed;border-color:var(--line);border-radius:12px;max-width:340px}
  .maillon.fourche::before{display:none}
  .maillon.fourche .mn{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);font-style:italic}
  html[dir="rtl"] .maillon.fourche .mn{font-style:normal}
  .fleche{color:var(--muted);opacity:.7}
  html[dir="rtl"] .fleche{transform:scaleX(-1);display:inline-block}
  .gens details.gnuance{border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-top:16px;max-width:760px}
  .gens details.gnuance summary{cursor:pointer;list-style:none;padding:12px 16px;font-family:system-ui,sans-serif;font-size:13px;color:var(--gold);display:flex;align-items:center;gap:10px}
  .gens details.gnuance summary::-webkit-details-marker{display:none}
  .gens .gbadge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:3px 9px;color:var(--gold)}
  html[dir="rtl"] .gens .gbadge{letter-spacing:.03em}
  .gens details.gnuance p{padding:0 16px 14px;color:#c6c0b2;font-size:14.5px}

  .aussi{max-width:1060px;margin:44px auto 0;padding:20px 20px 0;border-top:1px solid var(--line)}
  .aussi .albl{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  html[dir="rtl"] .aussi .albl{letter-spacing:.05em;font-family:'Amiri',sans-serif;font-size:13px}
  .aussi a{display:block;color:var(--ink);text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;padding:10px 0;border-bottom:1px solid var(--line)}
  html[dir="rtl"] .aussi a{font-family:'Amiri',serif}
  .aussi a:last-child{border-bottom:none}
  .aussi a:hover{color:var(--gold)}
  .aussi a::after{content:"\2192";color:var(--gold);margin-inline-start:9px;font-size:15px}
  html[dir="rtl"] .aussi a::after{content:"\2190"}

  /* navigation : la marque ramène à l'accueil, le fil est cliquable */
  a.brand{text-decoration:none}
  a.brand:hover{color:var(--ink)}
  a.brand:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  a.dot{text-decoration:none;color:inherit}
  a.dot[href]:hover .nm{color:var(--gold)}
  a.dot[href]:hover .pt{border-color:var(--gold)}
  a.dot[href]:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<div class="top">
  <a class="brand" id="brand" href="index.html"></a>
  <div class="langs" role="group" aria-label="Langue">
    <button data-l="fr" aria-pressed="true">FR</button>
    <button data-l="en" aria-pressed="false">EN</button>
    <button data-l="ar" aria-pressed="false">عربي</button>
  </div>
</div>
<div class="hero">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 class="display" id="title"></h1>
  <p class="lede" id="lede"></p>
</div>

<div class="phases">
  <div class="ptitle" id="phtitle"></div>
  <div class="pflow" id="pflow"></div>
</div>

<div class="filter" id="filter"></div>
<div class="timeline">
  <div class="tlwrap">
    <div class="axis" id="axis"></div>
    <div class="prow"><div class="rows" id="rows"></div></div>
  </div>
</div>

<div class="panel" id="panel"><div class="placeholder" id="ph"></div></div>

<section class="gens" id="gens"></section>

<div class="aussi" id="aussi"></div>

<footer id="foot"></footer>

<script>
// Les douze époques viennent de periodes.yml — une seule carte du temps.
// Prophètes : x = position sur l'axe (0=−1500, 100=+30). date affichée, phase, contexte, message, lien Christ.
const AXIS_MIN=-1500, AXIS_MAX=50;
function px(year){return ((year-AXIS_MIN)/(AXIS_MAX-AXIS_MIN))*100;}

const T={
fr:{dir:"ltr",albl:"Approfondir",liens:["Isaïe 53 — écrit sept siècles avant","La Transfiguration — Moïse, Élie, et le Fils"],brand:"L'AGNEAU DE DIEU",
 eyebrow:"L'Ancien Testament expliqué · la frise des veilleurs",
 title:"Pendant mille ans, des veilleurs ont décrit <em>un homme qu'ils ne verraient jamais</em>",
 lede:"Comprendre l'Ancien Testament, c'est d'abord comprendre son fil. Douze époques, une poignée de prophètes — et une seule direction : le Christ. Touchez une époque, puis un prophète.",
 phtitle:"Les douze époques de l'histoire — en un coup d'œil",
 phases:[
  ["origines","Époque 1","Monde des origines","Création → ~2200 av. J.-C.","La création, la chute, et la promesse faite le jour même de la faute ; le déluge, Babel. Des origines racontées, pas datées.","Adam, Abel, Noé"],
  ["patriarches","Époque 2","Les Patriarches","~2200–1800 av. J.-C.","Dieu choisit une famille : Abraham, Isaac, Jacob, Joseph. Sur le mont Morija, la question de l'agneau est posée pour la première fois.","Abraham, Isaac, Jacob, Joseph"],
  ["exode","Époque 3","Égypte et Exode","~1800–1446 av. J.-C.","Israël asservi en Égypte ; les dix plaies ; la première Pâque et la sortie ; l'alliance au Sinaï. Naissance d'un peuple.","Moïse, Aaron"],
  ["desert","Époque 4","Le Désert","1446–1406 av. J.-C.","Quarante ans au désert : la manne, les douze espions, le serpent d'airain, l'alliance renouvelée en Moab.","Moïse, Josué"],
  ["juges","Époque 5","Conquête et Juges","1406–1050 av. J.-C.","Le Jourdain, Jéricho, le partage du pays ; puis le cycle des juges, d'Othniel à Samson. Israël demande un roi.","Josué, Débora, Gédéon, Samson, Ruth, Samuel"],
  ["royaume","Époque 6","Le Royaume","1050–930 av. J.-C.","Saül, puis David règne à Jérusalem ; l'arche y monte ; Dieu fait alliance avec David. Salomon bâtit le Temple — et la promesse d'un trône éternel.","Saül, David, Salomon, Nathan"],
  ["division","Époque 7","Le Royaume divisé","930–722 av. J.-C.","Le royaume se divise : Israël au nord, Juda au sud. Élie, Élisée, Amos, Osée, Isaïe, Michée avertissent. Samarie tombe devant l'Assyrie.","Élie, Élisée, Isaïe, Amos, Osée, Michée"],
  ["exil","Époque 8","L'Exil","722–538 av. J.-C.","Juda part en exil en trois déportations (605, 597, 587) ; Babylone détruit le Temple. Jérémie, Ézéchiel, Daniel parlent depuis la captivité.","Jérémie, Ézéchiel, Daniel"],
  ["retour","Époque 9","Le Retour","538–167 av. J.-C.","La Perse renvoie les exilés ; le Temple est rebâti, plus modeste ; Esdras enseigne, Néhémie relève les murailles. On attend « quelque chose de plus ».","Zorobabel, Esdras, Néhémie, Aggée, Zacharie, Malachie"],
  ["maccabees","Époque 10","La révolte des Maccabées","167 av. J.-C. → an 1","Antiochos profane le Temple ; les Maccabées le reprennent et le purifient (Hanoukka, 164). Pas de prophète reconnu par toutes les traditions, mais des écrits — Maccabées, Siracide, Sagesse — reçus diversement selon les Églises. Rome arrive.","Judas Maccabée, les Hasmonéens, Hérode"],
  ["christ","Époque 11","L'Accomplissement","an 1–33","Jean-Baptiste rompt le silence : « Voici l'Agneau ». Baptême, Transfiguration, dernière Cène, croix, résurrection. Tout ce qui était annoncé prend un visage.","Jean-Baptiste, le Christ"],
  ["eglise","Époque 12","L'Église","an 33 →","L'Esprit descend à la Pentecôte ; le témoignage part de Jérusalem jusqu'aux extrémités de la terre. Les lettres, l'Apocalypse — et le retour du Christ attendu.","Pierre, Étienne, Paul, Jean"]],
 filterAll:"Toutes les époques",
 placeholder:"— Touchez un prophète sur la frise pour lire son message —",
 axislabels:[["-1500","−1500"],["-1000","−1000"],["-587","−587 (exil)"],["-500","−500"],["0","An 0"]],
 prophets:[
  {k:"moise",n:"Moïse",d:"~1300 av. J.-C.",phase:"exode",x:px(-1300),
   ctx:"À la sortie d'Égypte, le fondateur du peuple, celui qui reçoit la Loi et bâtit le premier culte sacrificiel.",
   msg:"Un prophète « comme moi » viendra, que Dieu suscitera du milieu du peuple : c'est lui qu'il faudra écouter.",
   ref:"Deutéronome 18:15",v:"L'Éternel suscitera un prophète comme moi : vous l'écouterez.",
   christ:"À la Transfiguration, la voix reprend ces mots exacts : « écoutez-le »."},
  {k:"nathan",n:"Nathan / David",d:"~1000 av. J.-C.",phase:"royaume",x:px(-1000),
   ctx:"Au sommet du royaume, le prophète Nathan porte à David une promesse qui dépasse toute dynastie humaine.",
   msg:"Ton trône sera affermi pour toujours : un descendant de David régnera sans fin.",
   ref:"2 Samuel 7:13",v:"J'affermirai pour toujours le trône de son royaume.",
   christ:"L'ange à Marie : « le Seigneur lui donnera le trône de David… son règne n'aura point de fin » (Luc 1:32-33)."},
  {k:"joel",n:"Joël",d:"~830 av. J.-C. (débattu)",phase:"division",x:px(-830),
   ctx:"Prophète de Juda, difficile à dater ; il annonce un jour où l'Esprit de Dieu ne sera plus réservé à quelques-uns.",
   msg:"Dieu répandra son Esprit sur toute chair — fils, filles, serviteurs : tous prophétiseront.",
   ref:"Joël 3:1",v:"Je répandrai mon Esprit sur toute chair.",
   christ:"Pierre, au matin de la Pentecôte : « c'est ici ce qui a été dit par le prophète Joël » (Actes 2:16-17)."},
  {k:"amos",n:"Amos",d:"~760 av. J.-C.",phase:"division",x:px(-760),
   ctx:"Un berger de Juda envoyé au riche royaume du Nord, qui dénonce l'injustice sociale au nom de Dieu.",
   msg:"Dieu rejette le culte sans justice ; mais il relèvera un jour « la hutte tombée de David ».",
   ref:"Amos 9:11",v:"En ce jour, je relèverai de sa chute la maison de David.",
   christ:"Cité au concile de Jérusalem pour dire que les nations sont incluses dans le royaume relevé (Actes 15:16)."},
  {k:"osee",n:"Osée",d:"~750 av. J.-C.",phase:"division",x:px(-750),
   ctx:"Prophète du royaume du Nord, dont le mariage douloureux devient l'image de l'amour fidèle de Dieu pour un peuple infidèle.",
   msg:"Malgré la trahison, Dieu rappellera son fils, et fera de « pas-mon-peuple » son peuple.",
   ref:"Osée 11:1",v:"Quand Israël était jeune, je l'aimais, et j'appelai mon fils hors d'Égypte.",
   christ:"Matthieu y lit le retour d'Égypte de l'enfant Jésus (Matthieu 2:15)."},
  {k:"esaie",n:"Ésaïe",d:"~700 av. J.-C.",phase:"division",x:px(-700),
   ctx:"Le plus cité des prophètes, actif à Jérusalem sous la menace assyrienne. Vision d'un Messie, d'un Serviteur souffrant, d'un salut pour toutes les nations.",
   msg:"Une vierge enfantera l'Emmanuel ; un serviteur portera, en silence, le péché de beaucoup.",
   ref:"Ésaïe 53:5",v:"Il était blessé pour nos péchés… par ses meurtrissures nous sommes guéris.",
   christ:"Le chapitre le plus cité par le Nouveau Testament ; copie complète retrouvée à Qumrân, avant J.-C."},
  {k:"michee",n:"Michée",d:"~700 av. J.-C.",phase:"division",x:px(-701),
   ctx:"Contemporain d'Ésaïe, prophète des campagnes, qui nomme le village d'où sortira le dominateur d'Israël.",
   msg:"De Bethléhem, petite entre les villes, sortira celui dont l'origine remonte aux temps anciens.",
   ref:"Michée 5:1",v:"Et toi, Bethléhem… de toi sortira celui qui dominera sur Israël.",
   christ:"Les scribes citent ce verset à Hérode pour indiquer le lieu de naissance du Messie (Matthieu 2:6)."},
  {k:"jeremie",n:"Jérémie",d:"~600 av. J.-C.",phase:"exil",x:px(-600),
   ctx:"Le prophète de l'effondrement : il voit Jérusalem tomber et le Temple brûler (587). Au cœur du désastre, il annonce l'inouï.",
   msg:"Dieu fera une alliance nouvelle : il écrira sa loi dans les cœurs, non sur des tables de pierre.",
   ref:"Jérémie 31:31",v:"Je ferai une alliance nouvelle avec la maison d'Israël.",
   christ:"Jésus, la coupe en main : « cette coupe est la nouvelle alliance en mon sang » (Luc 22:20)."},
  {k:"ezechiel",n:"Ézéchiel",d:"~590 av. J.-C.",phase:"exil",x:px(-590),
   ctx:"Prêtre déporté à Babylone, il console les exilés loin du Temple détruit par des visions de restauration.",
   msg:"Dieu ôtera le cœur de pierre, donnera un cœur nouveau, et sera lui-même le berger de son troupeau.",
   ref:"Ézéchiel 34:23",v:"J'établirai sur elles un seul pasteur… mon serviteur David.",
   christ:"« Je suis le bon berger ; le bon berger donne sa vie pour ses brebis » (Jean 10:11)."},
  {k:"daniel",n:"Daniel",d:"~550 av. J.-C.",phase:"exil",x:px(-550),
   ctx:"Haut fonctionnaire à la cour de Babylone puis de Perse ; ses visions embrassent la succession des empires jusqu'à un royaume éternel.",
   msg:"Un « Fils de l'homme » vient sur les nuées et reçoit une domination qui ne passera pas.",
   ref:"Daniel 7:13-14",v:"Sur les nuées arriva quelqu'un de semblable à un fils de l'homme.",
   christ:"Devant le grand prêtre, Jésus s'attribue cette vision — et c'est elle qui décide de sa condamnation (Matthieu 26:64)."},
  {k:"aggee",n:"Aggée",d:"~520 av. J.-C.",phase:"retour",x:px(-520),
   ctx:"Après le retour d'exil, il presse le peuple découragé de rebâtir le Temple, plus modeste que celui de Salomon.",
   msg:"La gloire de cette seconde maison sera plus grande que celle de la première.",
   ref:"Aggée 2:9",v:"La gloire de cette dernière maison sera plus grande que celle de la première.",
   christ:"Le second Temple n'eut pas l'arche — mais l'enfant Jésus y fut présenté (Luc 2:27-32)."},
  {k:"zacharie",n:"Zacharie",d:"~520 av. J.-C.",phase:"retour",x:px(-519),
   ctx:"Contemporain d'Aggée, il encourage la reconstruction par des visions riches sur le roi à venir.",
   msg:"Ton roi vient, humble, monté sur un âne ; on regardera vers « celui qu'ils ont percé ».",
   ref:"Zacharie 9:9",v:"Voici ton roi… humble et monté sur un âne.",
   christ:"L'entrée à Jérusalem, les Rameaux (Matthieu 21:5) ; le côté transpercé (Jean 19:37)."},
  {k:"malachie",n:"Malachie",d:"~430 av. J.-C.",phase:"retour",x:px(-430),
   ctx:"La dernière voix prophétique de l'Ancien Testament. Après lui, quatre siècles de silence.",
   msg:"Dieu enverra son messager pour préparer le chemin, et Élie reviendra avant le grand jour.",
   ref:"Malachie 3:1",v:"Voici, j'enverrai mon messager ; il préparera le chemin devant moi.",
   christ:"Jean-Baptiste est ce messager (Matthieu 11:10) et « l'Élie qui devait venir » (Matthieu 11:14)."},
  {k:"jean",n:"Jean-Baptiste",d:"~28 apr. J.-C.",phase:"christ",x:px(28),
   ctx:"Après quatre siècles de silence, un homme surgit au désert, vêtu comme Élie. Il ne montre pas du doigt un livre, mais une personne.",
   msg:"Le voici. Celui que tous les prophètes annonçaient est devant vous.",
   ref:"Jean 1:29",v:"Voici l'Agneau de Dieu, qui ôte le péché du monde.",
   christ:"Le fil des veilleurs s'achève ici : l'annonce devient présence. C'est le début du parcours de l'Agneau."}],
 footTitle:"Où va la frise",
 foot:"Chaque date est une estimation d'historien, pas un dogme : les fourchettes sont documentées dans le dossier de référence. Le but n'est pas la précision au siècle près, mais de rendre visible une chose simple — les annonces sont antérieures, et elles convergent.",
 genTitle:"Le fil des générations — remonter de Jésus à Adam",
 genIntro:"Matthieu ouvre son évangile en descendant, d'Abraham vers Jésus (Matthieu 1:1-17). Luc fait l'inverse : à partir de Jésus, il remonte de père en père jusqu'à « fils d'Adam, fils de Dieu » (Luc 3:23-38). Remonter le fil n'est donc pas notre invention — c'est un geste de l'Écriture elle-même. Le voici, maillon par maillon, aux couleurs de la carte du temps.",
 gen:[["Jésus","né de Marie"],["de Jésus à David, deux chemins — voir la nuance"],["David",""],["Jessé",""],["Obed","par Ruth"],["Boaz","par Rahab"],["Salmon",""],["Nahshon",""],["Amminadab",""],["Ram",""],["Hetsron",""],["Pérets","par Tamar"],["Juda",""],["Jacob",""],["Isaac",""],["Abraham",""],["Sem",""],["Noé",""],["Seth",""],["Adam","Luc 3:38"]],
 genBadge:"Débat interprétatif",
 genWhy:"Pourquoi deux généalogies ?",
 genNuance:"Matthieu descend d'Abraham à Jésus par la lignée royale — David, Salomon, les rois de Juda. Luc remonte de Jésus à Adam par une autre branche — David, Nathan. Les lectures anciennes et modernes proposent : une généalogie légale par Joseph chez Matthieu et une généalogie par Marie chez Luc ; ou deux lignées de Joseph lui-même (adoption, lévirat — l'explication de Julius Africanus, au IIIᵉ siècle). Aucune ne s'impose absolument : plusieurs lectures sérieuses restent possibles. Sur l'essentiel, les deux textes s'accordent : de David à Abraham, puis d'Abraham à Adam chez Luc, la chaîne est une — et les quatre femmes que Matthieu nomme (Tamar, Rahab, Ruth, la femme d'Urie) sont toutes dans la lignée du Messie.",
 label:{ctx:"Le contexte",msg:"Le message clé",link:"Le lien avec le Christ"}},
en:{dir:"ltr",albl:"Go deeper",liens:["Isaiah 53 — written seven centuries before","The Transfiguration — Moses, Elijah, and the Son"],brand:"THE LAMB OF GOD",
 eyebrow:"The Old Testament explained · the timeline of the watchmen",
 title:"For a thousand years, watchmen described <em>a man they would never see</em>",
 lede:"To understand the Old Testament is first to understand its thread. Twelve epochs, a handful of prophets — and one single direction: Christ. Touch an epoch, then a prophet.",
 phtitle:"The twelve epochs of the story — at a glance",
 phases:[
  ["origines","Epoch 1","Early World","Creation → c. 2200 BC","Creation, the fall, and the promise made on the very day of the fault; the flood, Babel. Origins told, not dated.","Adam, Abel, Noah"],
  ["patriarches","Epoch 2","The Patriarchs","c. 2200–1800 BC","God chooses a family: Abraham, Isaac, Jacob, Joseph. On Mount Moriah, the question of the lamb is asked for the first time.","Abraham, Isaac, Jacob, Joseph"],
  ["exode","Epoch 3","Egypt and Exodus","c. 1800–1446 BC","Israel enslaved in Egypt; the ten plagues; the first Passover and the going out; the covenant at Sinai. A people is born.","Moses, Aaron"],
  ["desert","Epoch 4","Desert Wanderings","1446–1406 BC","Forty years in the desert: the manna, the twelve spies, the bronze serpent, the covenant renewed in Moab.","Moses, Joshua"],
  ["juges","Epoch 5","Conquest and Judges","1406–1050 BC","The Jordan, Jericho, the dividing of the land; then the cycle of the judges, from Othniel to Samson. Israel asks for a king.","Joshua, Deborah, Gideon, Samson, Ruth, Samuel"],
  ["royaume","Epoch 6","Royal Kingdom","1050–930 BC","Saul, then David reigns in Jerusalem; the ark goes up; God makes covenant with David. Solomon builds the Temple — and the promise of an eternal throne.","Saul, David, Solomon, Nathan"],
  ["division","Epoch 7","Divided Kingdom","930–722 BC","The kingdom splits: Israel in the north, Judah in the south. Elijah, Elisha, Amos, Hosea, Isaiah, Micah warn. Samaria falls to Assyria.","Elijah, Elisha, Isaiah, Amos, Hosea, Micah"],
  ["exil","Epoch 8","Exile","722–538 BC","Judah goes into exile in three deportations (605, 597, 587); Babylon destroys the Temple. Jeremiah, Ezekiel, Daniel speak from captivity.","Jeremiah, Ezekiel, Daniel"],
  ["retour","Epoch 9","Return","538–167 BC","Persia sends the exiles home; the Temple is rebuilt, more modest; Ezra teaches, Nehemiah raises the walls. They await “something more”.","Zerubbabel, Ezra, Nehemiah, Haggai, Zechariah, Malachi"],
  ["maccabees","Epoch 10","Maccabean Revolt","167 BC → AD 1","Antiochus desecrates the Temple; the Maccabees retake and purify it (Hanukkah, 164). No prophet recognised by every tradition, but writings — Maccabees, Sirach, Wisdom — received differently across the Churches. Rome arrives.","Judas Maccabeus, the Hasmoneans, Herod"],
  ["christ","Epoch 11","Messianic Fulfillment","AD 1–33","John the Baptist breaks the silence: “Behold the Lamb”. Baptism, Transfiguration, Last Supper, cross, resurrection. All that was announced takes a face.","John the Baptist, the Christ"],
  ["eglise","Epoch 12","The Church","AD 33 →","The Spirit comes down at Pentecost; the witness goes out from Jerusalem to the ends of the earth. The letters, Revelation — and the awaited return of Christ.","Peter, Stephen, Paul, John"]],
 filterAll:"All epochs",
 placeholder:"— Touch a prophet on the timeline to read his message —",
 axislabels:[["-1500","−1500"],["-1000","−1000"],["-587","−587 (exile)"],["-500","−500"],["0","Year 0"]],
 prophets:[
  {k:"moise",n:"Moses",d:"~1300 BC",phase:"exode",x:px(-1300),
   ctx:"At the exodus, the founder of the people, who receives the Law and builds the first sacrificial worship.",
   msg:"A prophet “like me” will come, whom God will raise up from among the people: him you shall hear.",
   ref:"Deuteronomy 18:15",v:"The LORD will raise up a prophet like me: you shall listen to him.",
   christ:"At the Transfiguration, the voice repeats these exact words: “listen to him”."},
  {k:"nathan",n:"Nathan / David",d:"~1000 BC",phase:"royaume",x:px(-1000),
   ctx:"At the kingdom's peak, the prophet Nathan brings David a promise that surpasses any human dynasty.",
   msg:"Your throne will be established forever: a descendant of David will reign without end.",
   ref:"2 Samuel 7:13",v:"I will establish the throne of his kingdom forever.",
   christ:"The angel to Mary: “the Lord will give him the throne of David… his reign will have no end” (Luke 1:32-33)."},
  {k:"joel",n:"Joel",d:"~830 BC (debated)",phase:"division",x:px(-830),
   ctx:"A prophet of Judah, hard to date; he announces a day when God's Spirit will no longer be reserved for a few.",
   msg:"God will pour out his Spirit on all flesh — sons, daughters, servants: all will prophesy.",
   ref:"Joel 2:28",v:"I will pour out my Spirit on all flesh.",
   christ:"Peter, on the morning of Pentecost: “this is what was spoken through the prophet Joel” (Acts 2:16-17)."},
  {k:"amos",n:"Amos",d:"~760 BC",phase:"division",x:px(-760),
   ctx:"A shepherd of Judah sent to the wealthy northern kingdom, denouncing social injustice in God's name.",
   msg:"God rejects worship without justice; but one day he will raise up “the fallen booth of David”.",
   ref:"Amos 9:11",v:"In that day I will raise up the tent of David that is fallen.",
   christ:"Cited at the Council of Jerusalem to show the nations are included in the raised kingdom (Acts 15:16)."},
  {k:"osee",n:"Hosea",d:"~750 BC",phase:"division",x:px(-750),
   ctx:"A prophet of the northern kingdom, whose painful marriage becomes the image of God's faithful love for an unfaithful people.",
   msg:"Despite betrayal, God will call back his son, and make “not-my-people” his people.",
   ref:"Hosea 11:1",v:"When Israel was a child, I loved him, and called my son out of Egypt.",
   christ:"Matthew reads in it the return of the child Jesus from Egypt (Matthew 2:15)."},
  {k:"esaie",n:"Isaiah",d:"~700 BC",phase:"division",x:px(-700),
   ctx:"The most quoted of the prophets, active in Jerusalem under the Assyrian threat. Vision of a Messiah, a suffering Servant, salvation for all nations.",
   msg:"A virgin will bear Immanuel; a servant will bear, in silence, the sin of many.",
   ref:"Isaiah 53:5",v:"He was wounded for our transgressions… by his wounds we are healed.",
   christ:"The chapter most quoted by the New Testament; a complete copy found at Qumran, before Christ."},
  {k:"michee",n:"Micah",d:"~700 BC",phase:"division",x:px(-701),
   ctx:"A contemporary of Isaiah, a prophet of the countryside, who names the village from which the ruler of Israel will come.",
   msg:"From Bethlehem, little among the towns, will come one whose origin is from ancient days.",
   ref:"Micah 5:2",v:"You, Bethlehem… out of you will come forth one who will rule Israel.",
   christ:"The scribes quote this verse to Herod to point out the Messiah's birthplace (Matthew 2:6)."},
  {k:"jeremie",n:"Jeremiah",d:"~600 BC",phase:"exil",x:px(-600),
   ctx:"The prophet of collapse: he sees Jerusalem fall and the Temple burn (587). At the heart of disaster, he announces the unheard-of.",
   msg:"God will make a new covenant: he will write his law on hearts, not on tablets of stone.",
   ref:"Jeremiah 31:31",v:"I will make a new covenant with the house of Israel.",
   christ:"Jesus, cup in hand: “this cup is the new covenant in my blood” (Luke 22:20)."},
  {k:"ezechiel",n:"Ezekiel",d:"~590 BC",phase:"exil",x:px(-590),
   ctx:"A priest deported to Babylon, he comforts the exiles far from the destroyed Temple with visions of restoration.",
   msg:"God will remove the heart of stone, give a new heart, and himself be the shepherd of his flock.",
   ref:"Ezekiel 34:23",v:"I will set up one shepherd over them… my servant David.",
   christ:"“I am the good shepherd; the good shepherd lays down his life for the sheep” (John 10:11)."},
  {k:"daniel",n:"Daniel",d:"~550 BC",phase:"exil",x:px(-550),
   ctx:"A high official at the court of Babylon then Persia; his visions span the succession of empires up to an eternal kingdom.",
   msg:"A “Son of Man” comes on the clouds and receives a dominion that will not pass away.",
   ref:"Daniel 7:13-14",v:"On the clouds came one like a son of man.",
   christ:"Before the high priest, Jesus claims this vision — and it decides his condemnation (Matthew 26:64)."},
  {k:"aggee",n:"Haggai",d:"~520 BC",phase:"retour",x:px(-520),
   ctx:"After the return from exile, he urges the discouraged people to rebuild the Temple, more modest than Solomon's.",
   msg:"The glory of this second house will be greater than that of the first.",
   ref:"Haggai 2:9",v:"The latter glory of this house will be greater than the former.",
   christ:"The second Temple had no ark — but the child Jesus was presented there (Luke 2:27-32)."},
  {k:"zacharie",n:"Zechariah",d:"~520 BC",phase:"retour",x:px(-519),
   ctx:"A contemporary of Haggai, he encourages the rebuilding with rich visions of the coming king.",
   msg:"Your king comes, humble, riding on a donkey; they will look on “the one they pierced”.",
   ref:"Zechariah 9:9",v:"Behold, your king comes… humble, riding on a donkey.",
   christ:"The entry into Jerusalem, Palm Sunday (Matthew 21:5); the pierced side (John 19:37)."},
  {k:"malachie",n:"Malachi",d:"~430 BC",phase:"retour",x:px(-430),
   ctx:"The last prophetic voice of the Old Testament. After him, four centuries of silence.",
   msg:"God will send his messenger to prepare the way, and Elijah will return before the great day.",
   ref:"Malachi 3:1",v:"Behold, I send my messenger; he will prepare the way before me.",
   christ:"John the Baptist is this messenger (Matthew 11:10) and “the Elijah who was to come” (Matthew 11:14)."},
  {k:"jean",n:"John the Baptist",d:"~AD 28",phase:"christ",x:px(28),
   ctx:"After four centuries of silence, a man appears in the desert, dressed like Elijah. He points not to a book, but to a person.",
   msg:"Here he is. The one all the prophets announced stands before you.",
   ref:"John 1:29",v:"Behold, the Lamb of God, who takes away the sin of the world.",
   christ:"The thread of the watchmen ends here: announcement becomes presence. This is where the journey of the Lamb begins."}],
 footTitle:"Where the timeline goes",
 foot:"Each date is a historian's estimate, not a dogma: the ranges are documented in the reference dossier. The point is not precision to the century, but to make one simple thing visible — the announcements come first, and they converge.",
 genTitle:"The thread of generations — from Jesus back to Adam",
 genIntro:"Matthew opens his gospel going down, from Abraham to Jesus (Matthew 1:1-17). Luke does the opposite: starting from Jesus, he goes back father by father up to “the son of Adam, the son of God” (Luke 3:23-38). Going back up the thread is not our invention — it is a gesture of Scripture itself. Here it is, link by link, in the colours of the map of time.",
 gen:[["Jesus","born of Mary"],["from Jesus to David, two paths — see the nuance"],["David",""],["Jesse",""],["Obed","by Ruth"],["Boaz","by Rahab"],["Salmon",""],["Nahshon",""],["Amminadab",""],["Ram",""],["Hezron",""],["Perez","by Tamar"],["Judah",""],["Jacob",""],["Isaac",""],["Abraham",""],["Shem",""],["Noah",""],["Seth",""],["Adam","Luke 3:38"]],
 genBadge:"Interpretive debate",
 genWhy:"Why two genealogies?",
 genNuance:"Matthew goes down from Abraham to Jesus through the royal line — David, Solomon, the kings of Judah. Luke goes up from Jesus to Adam through another branch — David, Nathan. Ancient and modern readings propose: a legal genealogy through Joseph in Matthew and a genealogy through Mary in Luke; or two lines of Joseph himself (adoption, levirate — the explanation of Julius Africanus, in the 3rd century). None imposes itself absolutely: several serious readings remain possible. On the essential the two texts agree: from David to Abraham, then from Abraham to Adam in Luke, the chain is one — and the four women Matthew names (Tamar, Rahab, Ruth, the wife of Uriah) all stand in the line of the Messiah.",
 label:{ctx:"The context",msg:"The key message",link:"The link with Christ"}},
ar:{dir:"rtl",albl:"تعمَّق أكثر",liens:["إشعياء ٥٣ — كُتب قبل سبعة قرون","التجلّي — موسى، وإيليا، والابن"],brand:"حَمَلُ الله",
 eyebrow:"العهد القديم مشروحًا · الخط الزمني للحرّاس",
 title:"ألفَ سنة، وصف الحرّاسُ <em>رجلًا لن يروه أبدًا</em>",
 lede:"أن تفهم العهدَ القديم يعني أولًا أن تفهم خيطَه. اثنا عشر عصرًا، وحفنةٌ من الأنبياء — واتجاهٌ واحد: المسيح. المس عصرًا، ثم نبيًّا.",
 phtitle:"العصور الاثنا عشر للتاريخ — في نظرة",
 phases:[
  ["origines","العصر ١","عالم البدايات","الخلق ← نحو ٢٢٠٠ ق.م","الخلقُ، والسقوط، والوعدُ المُعطى في يوم الخطيئة نفسه؛ والطوفان، وبابل. بداياتٌ مرويّة لا مؤرَّخة.","آدم، هابيل، نوح"],
  ["patriarches","العصر ٢","الآباء","نحو ٢٢٠٠–١٨٠٠ ق.م","يختار اللهُ عائلة: إبراهيم، وإسحاق، ويعقوب، ويوسف. وعلى جبل المريّا يُطرح سؤالُ الحمل لأولِ مرة.","إبراهيم، إسحاق، يعقوب، يوسف"],
  ["exode","العصر ٣","مصر والخروج","نحو ١٨٠٠–١٤٤٦ ق.م","إسرائيلُ مستعبَدٌ في مصر؛ والضربات العشر؛ والفصحُ الأول والخروج؛ والعهدُ في سيناء. ميلادُ شعب.","موسى، هارون"],
  ["desert","العصر ٤","البرية","١٤٤٦–١٤٠٦ ق.م","أربعون سنةً في البرية: المنّ، والجواسيس الاثنا عشر، والحيّة النحاسية، والعهدُ المجدَّد في موآب.","موسى، يشوع"],
  ["juges","العصر ٥","الفتح والقضاة","١٤٠٦–١٠٥٠ ق.م","الأردن، وأريحا، وقسمةُ الأرض؛ ثم دورةُ القضاة من عثنيئيل إلى شمشون. ويطلب إسرائيلُ ملكًا.","يشوع، دبورة، جدعون، شمشون، راعوث، صموئيل"],
  ["royaume","العصر ٦","المملكة","١٠٥٠–٩٣٠ ق.م","شاول، ثم داود يملك في أورشليم؛ والتابوتُ يصعد إليها؛ ويقطع اللهُ عهدًا مع داود. وسليمان يبني الهيكل — ووعدُ عرشٍ أبدي.","شاول، داود، سليمان، ناثان"],
  ["division","العصر ٧","المملكة المنقسمة","٩٣٠–٧٢٢ ق.م","تنقسم المملكة: إسرائيل في الشمال، ويهوذا في الجنوب. إيليا، وأليشع، وعاموس، وهوشع، وإشعياء، وميخا ينذرون. وتسقط السامرةُ أمام أشور.","إيليا، أليشع، إشعياء، عاموس، هوشع، ميخا"],
  ["exil","العصر ٨","السبي","٧٢٢–٥٣٨ ق.م","يذهب يهوذا إلى السبي في ثلاثة سبايا (٦٠٥، ٥٩٧، ٥٨٧)؛ وتدمّر بابلُ الهيكل. إرميا، وحزقيال، ودانيال يتكلمون من الأسر.","إرميا، حزقيال، دانيال"],
  ["retour","العصر ٩","العودة","٥٣٨–١٦٧ ق.م","تُعيد فارسُ المسبيّين؛ ويُبنى الهيكلُ ثانيةً، أكثرَ تواضعًا؛ عزرا يعلّم، ونحميا يرفع الأسوار. ويُنتظَر «شيءٌ أعظم».","زربابل، عزرا، نحميا، حجي، زكريا، ملاخي"],
  ["maccabees","العصر ١٠","ثورة المكابيين","١٦٧ ق.م ← سنة ١","يدنّس أنطيوخس الهيكل؛ ويسترده المكابيون ويطهّرونه (عيد التجديد، ١٦٤). لا نبيَّ تعترف به كلُّ التقاليد، لكن كتاباتٍ — المكابيون، وابن سيراخ، والحكمة — تتلقّاها الكنائسُ على نحوٍ مختلف. وتصل روما.","يهوذا المكابي، الحشمونيون، هيرودس"],
  ["christ","العصر ١١","الإتمام المسيحاني","سنة ١–٣٣","يوحنا المعمدان يكسر الصمت: «هوذا الحمل». المعمودية، والتجلي، والعشاء الأخير، والصليب، والقيامة. وكلُّ ما أُعلن يأخذ وجهًا.","يوحنا المعمدان، المسيح"],
  ["eglise","العصر ١٢","الكنيسة","سنة ٣٣ ←","ينزل الروحُ في العنصرة؛ وتنطلق الشهادةُ من أورشليم إلى أقاصي الأرض. الرسائل، والرؤيا — وعودةُ المسيح المنتظَرة.","بطرس، استفانوس، بولس، يوحنا"]],

const LIENS=["page-etape4-isaie-53.html","pilier-transfiguration.html"];
// La remontée : une clé de periodes.yml par maillon, "fourche" pour l'embranchement
// Matthieu/Luc entre Jésus et David. Alignée par position sur c.gen (les noms,
// traduits). Mêmes teintes que partout : une seule carte du temps (D-015).
const EPOCOULEURS={origines:"#934f00",patriarches:"#967600",exode:"#889d37",desert:"#137738",juges:"#188d7c",royaume:"#19a4b7",division:"#0e6a9b",exil:"#5d74c7",retour:"#9f7ed6",maccabees:"#8b4486",christ:"#d3a94f",eglise:"#e9e3d3"};
const GENCLES=["christ","fourche","royaume","juges","juges","juges","juges","exode",
 "patriarches","patriarches","patriarches","patriarches","patriarches","patriarches","patriarches","patriarches",
 "origines","origines","origines","origines"];
function render(l){
  const c=T[l];
  document.documentElement.lang=l;document.documentElement.dir=c.dir;
  document.getElementById('brand').textContent=c.brand;
  document.getElementById('eyebrow').textContent=c.eyebrow;
  document.getElementById('title').innerHTML=c.title;
  document.getElementById('lede').textContent=c.lede;
  document.getElementById('phtitle').textContent=c.phtitle;
  // phases
  const pf=document.getElementById('pflow');pf.innerHTML="";
  c.phases.forEach(p=>{
    const d=document.createElement('div');d.className='phase';d.style.setProperty('--pc',EPOCOULEURS[p[0]]);
    d.innerHTML=`<div class="pnum">${p[1]}</div><h3>${p[2]}</h3><div class="pdate">${p[3]}</div><p>${p[4]}</p><span class="pwho">${p[5]}</span>`;
    d.addEventListener('click',()=>{setFilter(p[0]);});
    pf.appendChild(d);
  });
  // filtres
  const fl=document.getElementById('filter');fl.innerHTML="";
  const all=document.createElement('button');all.className='fchip';all.dataset.k="__all";all.setAttribute('aria-pressed','true');
  all.innerHTML=`${c.filterAll}`;all.addEventListener('click',()=>setFilter("__all"));fl.appendChild(all);
  c.phases.forEach(p=>{
    const b=document.createElement('button');b.className='fchip';b.dataset.k=p[0];b.setAttribute('aria-pressed','false');
    b.style.setProperty('--c',EPOCOULEURS[p[0]]);
    b.innerHTML=`<span class="d"></span>${p[2]}`;
    b.addEventListener('click',()=>setFilter(p[0]));fl.appendChild(b);
  });
  // axe : graduations
  const ax=document.getElementById('axis');
  // l'axe porte les couleurs des époques traversées, d'Égypte à l'accomplissement
  ax.style.background='linear-gradient('+(l==='ar'?270:90)+'deg,'+Object.values(EPOCOULEURS).slice(2,11).join(',')+')';ax.querySelectorAll('.tick,.tlabel').forEach(e=>e.remove());
  c.axislabels.forEach(([y,lab])=>{
    const x=px(+y);
    const t=document.createElement('div');t.className='tick';t.style.left=x+"%";ax.appendChild(t);
    const tl=document.createElement('div');tl.className='tlabel';tl.style.left=x+"%";tl.textContent=lab;ax.appendChild(tl);
  });
  // prophètes : disposer sur plusieurs "voies" pour éviter le chevauchement
  const rows=document.getElementById('rows');rows.innerHTML="";
  const lanes=[]; const NODE_W=10; // % largeur approx
  const sorted=[...c.prophets].sort((a,b)=>a.x-b.x);
  const laneOf={};
  sorted.forEach(p=>{
    let lane=0;
    while(lanes[lane]!==undefined && p.x-lanes[lane]<NODE_W) lane++;
    lanes[lane]=p.x; laneOf[p.k]=lane;
  });
  const laneH=64; const maxLane=Math.max(...Object.values(laneOf));
  rows.style.height=((maxLane+1)*laneH)+"px";
  c.prophets.forEach(p=>{
    const node=document.createElement('div');node.className='pnode';node.dataset.k=p.k;node.dataset.phase=p.phase;
    node.style.left=p.x+"%";node.style.top=(laneOf[p.k]*laneH)+"px";
    node.style.setProperty('--c',EPOCOULEURS[p.phase]);
    node.innerHTML=`<div class="dot"></div><div class="pn">${p.n}</div><div class="pd">${p.d}</div>`;
    node.addEventListener('click',()=>select(p,l));
    rows.appendChild(node);
  });
  document.getElementById('ph').textContent=c.placeholder;
  document.getElementById('panel').innerHTML='<div class="placeholder" id="ph">'+c.placeholder+'</div>';
  const gz=document.getElementById('gens');
  gz.innerHTML=`<h2 class="gh">${c.genTitle}</h2><p class="gp">${c.genIntro}</p>
    <div class="chaine">${c.gen.map((g,i)=>{
      const cle=GENCLES[i];
      const chip=cle==="fourche"
        ? `<span class="maillon fourche"><span class="mn">${g[0]}</span></span>`
        : `<span class="maillon" style="--pc:${EPOCOULEURS[cle]}"><span class="mn">${g[0]}</span>${g[1]?`<span class="mq">${g[1]}</span>`:""}</span>`;
      return chip+(i<c.gen.length-1?`<span class="fleche">→</span>`:"");
    }).join("")}</div>
    <details class="gnuance"><summary><span class="gbadge">${c.genBadge}</span>${c.genWhy}</summary><p>${c.genNuance}</p></details>`;
  document.getElementById('aussi').innerHTML=`<div class="albl">${c.albl}</div>`+c.liens.map((x,i)=>`<a href="${LIENS[i]}">${x}</a>`).join("");
  document.getElementById('foot').innerHTML=`<strong>${c.footTitle}.</strong> ${c.foot}<br>Segond 1910 · WEB · Van Dyck.`;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false'));
  window.__lang=l;
}
function setFilter(k){
  const chips=document.querySelectorAll('.fchip');
  chips.forEach(c=>c.setAttribute('aria-pressed', (c.dataset.k===k)?'true':'false'));
  document.querySelectorAll('.pnode').forEach(n=>{
    n.classList.toggle('dim', k!=="__all" && n.dataset.phase!==k);
  });
}
function select(p,l){
  const c=T[l];
  document.querySelectorAll('.pnode .dot').forEach(d=>d.style.transform="");
  const panel=document.getElementById('panel');
  const col=EPOCOULEURS[p.phase];
  panel.innerHTML=`<div class="card show" style="--pc:${col}">
    <span class="badge">${c.phases.find(ph=>ph[0]===p.phase)[2]}</span>
    <h2>${p.n}</h2>
    <div class="when">${p.d}</div>
    <div class="lbl">${c.label.ctx}</div><div class="ctx">${p.ctx}</div>
    <div class="lbl">${c.label.msg}</div><div class="msg">${p.msg}</div>
    <div class="link"><div class="ref">${p.ref}</div><p>« ${p.v} »</p>
      <div class="lbl" style="margin-top:12px">${c.label.link}</div><div class="ctx">${p.christ}</div>
    </div>
  </div>`;
  if(window.innerWidth<900) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.l)));
render('fr');
