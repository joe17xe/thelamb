# livres.yml — les 73 livres du site vers la versification de référence
#
# `code` est celui de `textes/vref.txt` : c'est la clé qui donne accès aux
# textes. Les trois noms sont ceux des pupitres — la source reste
# salle-bibliotheque.html, ce fichier n'en est qu'une projection pour les outils.
# `autres` liste les formes que le site emploie ailleurs (« Psaume 22:2 »).
#
# Régénérer :  python3 outils/importer-textes.py --livres

