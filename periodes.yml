# periodes.yml — la carte du temps, en donnée
#
# Douze époques qui situent une page, un livre, un maillon dans l'histoire — aux
# termes du dépliant de Jeff Cavins (The Bible Timeline), traduits, décision D-018
# et D-019. Ce n'est pas l'ordre de lecture du site : le chemin part du Christ
# (décision D-007, confirmée en D-019). La frise répond à « quand ».
#
# Les dates sont celles du dépliant : elles suivent la chronologie haute (Exode
# en 1446 av. J.-C.), et les spécialistes ne s'accordent pas sur les plus anciennes.
# Les couleurs sont les nôtres, validées sur le fond du site (contraste, séparation
# pour les daltoniens entre époques voisines) ; l'Église porte l'encre.
#
# Une seule carte du temps : tout s'y branche, rien ne la double.

periodes:

