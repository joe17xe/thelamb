# periodes.yml — la carte du temps, en donnée
#
# Douze époques qui situent une page, un livre, un maillon dans l'histoire — aux
# termes du dépliant de Jeff Cavins (The Bible Timeline), traduits, décision D-018
# et D-019. Ce n'est pas l'ordre de lecture du site : le chemin part du Christ
# (décision D-007, confirmée en D-019). La frise répond à « quand ».
#
# Les dates sont celles du dépliant : elles suivent la chronologie haute (Exode
# en 1446 av. J.-C.), et les spécialistes ne s'accordent pas sur les plus anciennes.
# Les couleurs sont les nôtres, validées sur le fond du site (contraste, séparation
# pour les daltoniens entre époques voisines) ; l'Église porte l'encre.
#
# Une seule carte du temps : tout s'y branche, rien ne la double.

periodes:

  - cle: origines
    couleur: "#22a89a"
    fr: {nom: "Monde des origines", dates: "Création → ~2200 av. J.-C.",
         texte: "La création, la chute, et la promesse faite le jour même de la faute ; le déluge, Babel. Des origines racontées, pas datées.",
         figures: "Adam, Abel, Noé"}
    en: {nom: "Early World", dates: "Creation → c. 2200 BC",
         texte: "Creation, the fall, and the promise made on the very day of the fault; the flood, Babel. Origins told, not dated.",
         figures: "Adam, Abel, Noah"}
    ar: {nom: "عالم البدايات", dates: "الخلق ← نحو ٢٢٠٠ ق.م",
         texte: "الخلقُ، والسقوط، والوعدُ المُعطى في يوم الخطيئة نفسه؛ والطوفان، وبابل. بداياتٌ مرويّة لا مؤرَّخة.",
         figures: "آدم، هابيل، نوح"}

  - cle: patriarches
    couleur: "#944887"
    fr: {nom: "Les Patriarches", dates: "~2200–1800 av. J.-C.",
         texte: "Dieu choisit une famille : Abraham, Isaac, Jacob, Joseph. Sur le mont Morija, la question de l'agneau est posée pour la première fois.",
         figures: "Abraham, Isaac, Jacob, Joseph"}
    en: {nom: "The Patriarchs", dates: "c. 2200–1800 BC",
         texte: "God chooses a family: Abraham, Isaac, Jacob, Joseph. On Mount Moriah, the question of the lamb is asked for the first time.",
         figures: "Abraham, Isaac, Jacob, Joseph"}
    ar: {nom: "الآباء", dates: "نحو ٢٢٠٠–١٨٠٠ ق.م",
         texte: "يختار اللهُ عائلة: إبراهيم، وإسحاق، ويعقوب، ويوسف. وعلى جبل المريّا يُطرح سؤالُ الحمل لأولِ مرة.",
         figures: "إبراهيم، إسحاق، يعقوب، يوسف"}

  - cle: exode
    couleur: "#d66f6a"
    fr: {nom: "Égypte et Exode", dates: "~1800–1446 av. J.-C.",
         texte: "Israël asservi en Égypte ; les dix plaies ; la première Pâque et la sortie ; l'alliance au Sinaï. Naissance d'un peuple.",
         figures: "Moïse, Aaron"}
    en: {nom: "Egypt and Exodus", dates: "c. 1800–1446 BC",
         texte: "Israel enslaved in Egypt; the ten plagues; the first Passover and the going out; the covenant at Sinai. A people is born.",
         figures: "Moses, Aaron"}
    ar: {nom: "مصر والخروج", dates: "نحو ١٨٠٠–١٤٤٦ ق.م",
         texte: "إسرائيلُ مستعبَدٌ في مصر؛ والضربات العشر؛ والفصحُ الأول والخروج؛ والعهدُ في سيناء. ميلادُ شعب.",
         figures: "موسى، هارون"}

  - cle: desert
    couleur: "#8e5e01"
    fr: {nom: "Le Désert", dates: "1446–1406 av. J.-C.",
         texte: "Quarante ans au désert : la manne, les douze espions, le serpent d'airain, l'alliance renouvelée en Moab.",
         figures: "Moïse, Josué"}
    en: {nom: "Desert Wanderings", dates: "1446–1406 BC",
         texte: "Forty years in the desert: the manna, the twelve spies, the bronze serpent, the covenant renewed in Moab.",
         figures: "Moses, Joshua"}
    ar: {nom: "البرية", dates: "١٤٤٦–١٤٠٦ ق.م",
         texte: "أربعون سنةً في البرية: المنّ، والجواسيس الاثنا عشر، والحيّة النحاسية، والعهدُ المجدَّد في موآب.",
         figures: "موسى، يشوع"}

  - cle: juges
    couleur: "#66a555"
    fr: {nom: "Conquête et Juges", dates: "1406–1050 av. J.-C.",
         texte: "Le Jourdain, Jéricho, le partage du pays ; puis le cycle des juges, d'Othniel à Samson. Israël demande un roi.",
         figures: "Josué, Débora, Gédéon, Samson, Ruth, Samuel"}
    en: {nom: "Conquest and Judges", dates: "1406–1050 BC",
         texte: "The Jordan, Jericho, the dividing of the land; then the cycle of the judges, from Othniel to Samson. Israel asks for a king.",
         figures: "Joshua, Deborah, Gideon, Samson, Ruth, Samuel"}
    ar: {nom: "الفتح والقضاة", dates: "١٤٠٦–١٠٥٠ ق.م",
         texte: "الأردن، وأريحا، وقسمةُ الأرض؛ ثم دورةُ القضاة من عثنيئيل إلى شمشون. ويطلب إسرائيلُ ملكًا.",
         figures: "يشوع، دبورة، جدعون، شمشون، راعوث، صموئيل"}

  - cle: royaume
    couleur: "#7a53a5"
    fr: {nom: "Le Royaume", dates: "1050–930 av. J.-C.",
         texte: "Saül, puis David règne à Jérusalem ; l'arche y monte ; Dieu fait alliance avec David. Salomon bâtit le Temple — et la promesse d'un trône éternel.",
         figures: "Saül, David, Salomon, Nathan"}
    en: {nom: "Royal Kingdom", dates: "1050–930 BC",
         texte: "Saul, then David reigns in Jerusalem; the ark goes up; God makes covenant with David. Solomon builds the Temple — and the promise of an eternal throne.",
         figures: "Saul, David, Solomon, Nathan"}
    ar: {nom: "المملكة", dates: "١٠٥٠–٩٣٠ ق.م",
         texte: "شاول، ثم داود يملك في أورشليم؛ والتابوتُ يصعد إليها؛ ويقطع اللهُ عهدًا مع داود. وسليمان يبني الهيكل — ووعدُ عرشٍ أبدي.",
         figures: "شاول، داود، سليمان، ناثان"}

  - cle: division
    couleur: "#13a7a6"
    fr: {nom: "Le Royaume divisé", dates: "930–722 av. J.-C.",
         texte: "Le royaume se divise : Israël au nord, Juda au sud. Élie, Élisée, Amos, Osée, Isaïe, Michée avertissent. Samarie tombe devant l'Assyrie.",
         figures: "Élie, Élisée, Isaïe, Amos, Osée, Michée"}
    en: {nom: "Divided Kingdom", dates: "930–722 BC",
         texte: "The kingdom splits: Israel in the north, Judah in the south. Elijah, Elisha, Amos, Hosea, Isaiah, Micah warn. Samaria falls to Assyria.",
         figures: "Elijah, Elisha, Isaiah, Amos, Hosea, Micah"}
    ar: {nom: "المملكة المنقسمة", dates: "٩٣٠–٧٢٢ ق.م",
         texte: "تنقسم المملكة: إسرائيل في الشمال، ويهوذا في الجنوب. إيليا، وأليشع، وعاموس، وهوشع، وإشعياء، وميخا ينذرون. وتسقط السامرةُ أمام أشور.",
         figures: "إيليا، أليشع، إشعياء، عاموس، هوشع، ميخا"}

  - cle: exil
    couleur: "#1570a1"
    fr: {nom: "L'Exil", dates: "722–538 av. J.-C.",
         texte: "Juda part en exil en trois déportations (605, 597, 587) ; Babylone détruit le Temple. Jérémie, Ézéchiel, Daniel parlent depuis la captivité.",
         figures: "Jérémie, Ézéchiel, Daniel"}
    en: {nom: "Exile", dates: "722–538 BC",
         texte: "Judah goes into exile in three deportations (605, 597, 587); Babylon destroys the Temple. Jeremiah, Ezekiel, Daniel speak from captivity.",
         figures: "Jeremiah, Ezekiel, Daniel"}
    ar: {nom: "السبي", dates: "٧٢٢–٥٣٨ ق.م",
         texte: "يذهب يهوذا إلى السبي في ثلاثة سبايا (٦٠٥، ٥٩٧، ٥٨٧)؛ وتدمّر بابلُ الهيكل. إرميا، وحزقيال، ودانيال يتكلمون من الأسر.",
         figures: "إرميا، حزقيال، دانيال"}

  - cle: retour
    couleur: "#a6931a"
    fr: {nom: "Le Retour", dates: "538–167 av. J.-C.",
         texte: "La Perse renvoie les exilés ; le Temple est rebâti, plus modeste ; Esdras enseigne, Néhémie relève les murailles. On attend « quelque chose de plus ».",
         figures: "Zorobabel, Esdras, Néhémie, Aggée, Zacharie, Malachie"}
    en: {nom: "Return", dates: "538–167 BC",
         texte: "Persia sends the exiles home; the Temple is rebuilt, more modest; Ezra teaches, Nehemiah raises the walls. They await “something more”.",
         figures: "Zerubbabel, Ezra, Nehemiah, Haggai, Zechariah, Malachi"}
    ar: {nom: "العودة", dates: "٥٣٨–١٦٧ ق.م",
         texte: "تُعيد فارسُ المسبيّين؛ ويُبنى الهيكلُ ثانيةً، أكثرَ تواضعًا؛ عزرا يعلّم، ونحميا يرفع الأسوار. ويُنتظَر «شيءٌ أعظم».",
         figures: "زربابل، عزرا، نحميا، حجي، زكريا، ملاخي"}

  - cle: maccabees
    couleur: "#a24d13"
    fr: {nom: "La révolte des Maccabées", dates: "167 av. J.-C. → an 1",
         texte: "Antiochos profane le Temple ; les Maccabées le reprennent et le purifient (Hanoukka, 164). Pas de prophète reconnu par toutes les traditions, mais des écrits — Maccabées, Siracide, Sagesse — reçus diversement selon les Églises. Rome arrive.",
         figures: "Judas Maccabée, les Hasmonéens, Hérode"}
    en: {nom: "Maccabean Revolt", dates: "167 BC → AD 1",
         texte: "Antiochus desecrates the Temple; the Maccabees retake and purify it (Hanukkah, 164). No prophet recognised by every tradition, but writings — Maccabees, Sirach, Wisdom — received differently across the Churches. Rome arrives.",
         figures: "Judas Maccabeus, the Hasmoneans, Herod"}
    ar: {nom: "ثورة المكابيين", dates: "١٦٧ ق.م ← سنة ١",
         texte: "يدنّس أنطيوخس الهيكل؛ ويسترده المكابيون ويطهّرونه (عيد التجديد، ١٦٤). لا نبيَّ تعترف به كلُّ التقاليد، لكن كتاباتٍ — المكابيون، وابن سيراخ، والحكمة — تتلقّاها الكنائسُ على نحوٍ مختلف. وتصل روما.",
         figures: "يهوذا المكابي، الحشمونيون، هيرودس"}

  - cle: christ
    couleur: "#bc871b"
    fr: {nom: "L'Accomplissement", dates: "an 1–33",
         texte: "Jean-Baptiste rompt le silence : « Voici l'Agneau ». Baptême, Transfiguration, dernière Cène, croix, résurrection. Tout ce qui était annoncé prend un visage.",
         figures: "Jean-Baptiste, le Christ"}
    en: {nom: "Messianic Fulfillment", dates: "AD 1–33",
         texte: "John the Baptist breaks the silence: “Behold the Lamb”. Baptism, Transfiguration, Last Supper, cross, resurrection. All that was announced takes a face.",
         figures: "John the Baptist, the Christ"}
    ar: {nom: "الإتمام المسيحاني", dates: "سنة ١–٣٣",
         texte: "يوحنا المعمدان يكسر الصمت: «هوذا الحمل». المعمودية، والتجلي، والعشاء الأخير، والصليب، والقيامة. وكلُّ ما أُعلن يأخذ وجهًا.",
         figures: "يوحنا المعمدان، المسيح"}

  - cle: eglise
    couleur: "#e9e3d3"
    fr: {nom: "L'Église", dates: "an 33 →",
         texte: "L'Esprit descend à la Pentecôte ; le témoignage part de Jérusalem jusqu'aux extrémités de la terre. Les lettres, l'Apocalypse — et le retour du Christ attendu.",
         figures: "Pierre, Étienne, Paul, Jean"}
    en: {nom: "The Church", dates: "AD 33 →",
         texte: "The Spirit comes down at Pentecost; the witness goes out from Jerusalem to the ends of the earth. The letters, Revelation — and the awaited return of Christ.",
         figures: "Peter, Stephen, Paul, John"}
    ar: {nom: "الكنيسة", dates: "سنة ٣٣ ←",
         texte: "ينزل الروحُ في العنصرة؛ وتنطلق الشهادةُ من أورشليم إلى أقاصي الأرض. الرسائل، والرؤيا — وعودةُ المسيح المنتظَرة.",
         figures: "بطرس، استفانوس، بولس، يوحنا"}

